<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calvix AI · CRM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --header-bg:   #0d2b1f;
  --header-bg2:  #12382a;
  --bg-page:     #f4f7f4;
  --bg-card:     #ffffff;
  --bg-hover:    #f0f7f3;
  --line:        #e2ece6;
  --ink:         #0d2b1f;
  --ink-2:       #2d5244;
  --ink-3:       #6b9080;
  --ink-4:       #a8c4b8;
  --inv:         #ffffff;
  --inv-2:       rgba(255,255,255,.72);
  --inv-3:       rgba(255,255,255,.42);
  --inv-line:    rgba(255,255,255,.1);

  --accent:      #1a6b3c;
  --accent-lt:   #22c55e;
  --accent-glow: rgba(26,107,60,.3);
  --danger:      #e53e3e;
  --danger-lt:   #fff5f5;
  --danger-line: #fecaca;

  --c-orange:    #f97316;
  --c-orange-bg: rgba(249,115,22,.1);
  --c-blue:      #3b82f6;
  --c-blue-bg:   rgba(59,130,246,.1);
  --c-red:       #ef4444;
  --c-red-bg:    rgba(239,68,68,.1);
  --c-green:     #16a34a;
  --c-green-bg:  rgba(22,163,74,.1);
  --c-purple:    #8b5cf6;
  --c-purple-bg: rgba(139,92,246,.1);

  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 1px 3px rgba(13,43,31,.06), 0 4px 16px rgba(13,43,31,.07);
  --shadow-lg: 0 8px 32px rgba(13,43,31,.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-page);
  color: var(--ink);
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Shell ──────────────────────────────────────── */
.shell { min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ─────────────────────────────────────── */
.header {
  background: var(--header-bg);
  height: 64px;
  display: flex; align-items: center;
  padding: 0 28px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 20px rgba(0,0,0,.3);
}
.header-inner {
  max-width: 1440px; width: 100%; margin: 0 auto;
  display: flex; align-items: center; gap: 0;
}
.logo-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent-lt), var(--accent));
  display: grid; place-items: center;
  font-weight: 800; font-size: 16px; color: #fff;
  box-shadow: 0 2px 10px var(--accent-glow);
}
.logo-text {
  font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.03em; line-height: 1.2;
}
.logo-text em { color: #4ade80; font-style: normal; }
.logo-sub { font-size: 10.5px; color: var(--inv-3); }

/* Nav tabs */
.nav-tabs {
  display: flex; gap: 2px; margin-left: 28px; flex: 1;
}
.nav-tab {
  padding: 8px 16px; border-radius: var(--radius-sm);
  color: var(--inv-3); font: inherit; font-size: 13px; font-weight: 500;
  background: transparent; border: 0; cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.nav-tab:hover { background: rgba(255,255,255,.08); color: var(--inv-2); }
.nav-tab.active { background: rgba(74,222,128,.15); color: #4ade80; font-weight: 600; }

/* Live badge */
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--inv-3); margin-left: auto; flex-shrink: 0;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── Page wrapper ───────────────────────────────── */
.page { max-width: 1440px; margin: 0 auto; padding: 24px 28px 56px; }

/* ── KPI Grid ───────────────────────────────────── */
.kpi-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 14px;
  margin-bottom: 24px;
}
@media (max-width: 960px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } }

.kpi-card {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 20px 22px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--kpi-color); border-radius: var(--radius) var(--radius) 0 0;
}
.kpi-icon-wrap {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--kpi-bg); display: grid; place-items: center;
  font-size: 20px; margin-bottom: 14px;
}
.kpi-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); font-weight: 600; margin-bottom: 6px;
}
.kpi-value {
  font-size: 40px; font-weight: 700; letter-spacing: -.05em; line-height: 1;
  color: var(--ink);
}
.kpi-value.loading { color: var(--ink-4); font-size: 26px; }

/* ── Filter bar ─────────────────────────────────── */
.filter-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-label { font-size: 12px; color: var(--ink-3); font-weight: 500; }
select.sel {
  appearance: none;
  background: var(--bg-card);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  color: var(--ink); font: inherit; font-size: 12.5px;
  padding: 7px 30px 7px 11px; cursor: pointer; outline: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236b9080' d='M0 0h10L5 6z'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center;
  box-shadow: var(--shadow); min-width: 180px;
  transition: border-color .15s;
}
select.sel:focus { border-color: var(--accent); }

.seg {
  display: inline-flex; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 3px; gap: 2px; box-shadow: var(--shadow);
}
.seg button {
  background: transparent; border: 0;
  color: var(--ink-3); font: inherit; font-size: 12px; font-weight: 500;
  padding: 4px 13px; border-radius: 6px; cursor: pointer;
  transition: background .12s, color .12s;
}
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

.spacer { flex: 1; }

.btn-refresh {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--line);
  color: var(--ink-2); font: inherit; font-size: 12.5px; cursor: pointer;
  box-shadow: var(--shadow); transition: border-color .15s, color .15s;
}
.btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

/* ── Section header ─────────────────────────────── */
.section { margin-bottom: 28px; }
.section-hd {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.section-title { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.count-badge {
  padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--header-bg); color: #4ade80;
  border: 1px solid rgba(74,222,128,.22);
}

/* ── Table ──────────────────────────────────────── */
.table-card {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-3); font-weight: 600;
  padding: 11px 16px; border-bottom: 1px solid var(--line);
  background: #f8fbf8; white-space: nowrap;
}
tbody td {
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  color: var(--ink-2); vertical-align: middle;
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--bg-hover); }

.td-name { color: var(--ink); font-weight: 600; }
.td-phone { font-family: monospace; color: var(--ink-3); font-size: 11.5px; }
.td-nick { color: var(--c-green); font-family: monospace; font-size: 12px; font-weight: 500; }
.td-msg { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); }
.td-date { font-family: monospace; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.td-time { font-family: monospace; font-size: 12px; color: var(--c-blue); font-weight: 600; white-space: nowrap; }

.chip-biz {
  display: inline-flex; padding: 2px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 500;
  background: var(--c-green-bg); color: var(--ink-2); border: 1px solid rgba(22,163,74,.15);
}
.chip-trigger {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
  background: var(--c-orange-bg); color: var(--c-orange);
  border: 1px solid rgba(249,115,22,.2); white-space: nowrap;
}
.empty-row td {
  text-align: center; padding: 48px; color: var(--ink-4); font-size: 13px;
}

/* ── Spinner / loader ───────────────────────────── */
.loader {
  display: flex; align-items: center; justify-content: center;
  padding: 52px; color: var(--ink-4); gap: 10px; font-size: 13px;
}
.spin {
  width: 18px; height: 18px; border: 2px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error box ──────────────────────────────────── */
.err-box {
  background: var(--danger-lt); border: 1px solid var(--danger-line);
  border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 18px;
}
.err-title { font-weight: 700; color: var(--danger); font-size: 13px; margin-bottom: 4px; }
.err-detail { color: #e53e3e; font-size: 11.5px; font-family: monospace; word-break: break-all; }
.err-hint { color: var(--ink-3); font-size: 11.5px; margin-top: 6px; line-height: 1.6; }

/* ── Toast ──────────────────────────────────────── */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg); animation: slideIn .25s ease;
  max-width: 340px;
}
.toast.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
.toast.error   { background: var(--danger-lt); color: var(--danger); border: 1px solid var(--danger-line); }
@keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:none;opacity:1} }

/* ── Buttons ────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font: inherit; font-size: 13px; font-weight: 600; border: 0; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { opacity: .9; }
.btn-danger  { background: var(--danger); color: #fff; box-shadow: 0 2px 8px rgba(229,62,62,.25); }
.btn-danger:hover:not(:disabled) { opacity: .9; }
.btn-outline {
  background: transparent; color: var(--ink-2);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost-sm {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500;
  background: transparent; border: 1px solid var(--line); color: var(--ink-3); cursor: pointer;
  transition: border-color .15s, color .15s;
}
.btn-ghost-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger-sm {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500;
  background: transparent; border: 1px solid var(--danger-line); color: var(--danger); cursor: pointer;
  transition: background .15s;
}
.btn-danger-sm:hover { background: var(--danger-lt); }

/* ── Settings tab ───────────────────────────────── */
.settings-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 20px;
}
.settings-card {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 28px 28px 24px;
  box-shadow: var(--shadow);
}
.settings-card h3 {
  font-size: 15px; font-weight: 700; color: var(--ink);
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.settings-card .sub {
  font-size: 12px; color: var(--ink-3); margin-bottom: 22px; line-height: 1.6;
}
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11.5px; font-weight: 600;
  color: var(--ink-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em;
}
.field input, .field textarea {
  width: 100%; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  color: var(--ink); font: inherit; font-size: 13px;
  padding: 9px 12px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(26,107,60,.1);
}
.field textarea { resize: vertical; }
.field .note { font-size: 11px; color: var(--ink-4); margin-top: 5px; line-height: 1.5; }
.settings-saved { color: var(--c-green); font-size: 12px; font-weight: 500; }

/* ── Bots tab ───────────────────────────────────── */
.bots-layout {
  display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start;
}
@media (max-width: 900px) { .bots-layout { grid-template-columns: 1fr; } }

.bots-panel {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.bots-panel-hd {
  padding: 16px 18px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.bots-panel-title { font-size: 14px; font-weight: 700; color: var(--ink); }

.bot-card {
  padding: 16px 18px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .12s;
}
.bot-card:last-child { border-bottom: 0; }
.bot-card:hover { background: var(--bg-hover); }
.bot-card.selected { background: rgba(26,107,60,.06); border-left: 3px solid var(--accent); }

.bot-card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.bot-card-name { font-size: 14px; font-weight: 700; color: var(--ink); }
.badge-active {
  padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--c-green-bg); color: var(--c-green);
  border: 1px solid rgba(22,163,74,.2);
}
.badge-inactive {
  padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: rgba(107,144,128,.1); color: var(--ink-3);
  border: 1px solid var(--line);
}
.bot-card-username { font-size: 11.5px; color: var(--c-green); font-family: monospace; margin-bottom: 6px; }
.bot-card-prompt {
  font-size: 11.5px; color: var(--ink-3); line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bot-card-actions { display: flex; gap: 6px; margin-top: 10px; }

/* Empty bots state */
.bots-empty {
  padding: 48px 24px; text-align: center;
}
.bots-empty-icon { font-size: 40px; margin-bottom: 12px; }
.bots-empty-text { color: var(--ink-3); font-size: 13px; margin-bottom: 16px; }

/* Bot form */
.bot-form-card {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.bot-form-hd {
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.bot-form-title { font-size: 15px; font-weight: 700; color: var(--ink); }
.bot-form-body { padding: 24px; }
.bot-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 680px) { .bot-form-row { grid-template-columns: 1fr; } }
.bot-form-footer {
  padding: 16px 24px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}

/* Toggle switch */
.toggle-wrap { display: flex; align-items: center; gap: 10px; }
.toggle {
  position: relative; display: inline-block; width: 40px; height: 22px;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: var(--line); border-radius: 999px;
  cursor: pointer; transition: background .2s;
}
.toggle-slider::before {
  content: ''; position: absolute; width: 16px; height: 16px;
  background: #fff; border-radius: 50%; left: 3px; top: 3px;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
.toggle-label { font-size: 13px; font-weight: 500; color: var(--ink-2); }

/* ── No config state ────────────────────────────── */
.no-cfg {
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 40px 32px; text-align: center;
  box-shadow: var(--shadow); max-width: 480px; margin: 32px auto;
}
.no-cfg h3 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.no-cfg p { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { createClient } = supabase;

// ── Constants ──────────────────────────────────────────────────────────────────
const SUPABASE_KEY   = 'calvix_cfg';
const API_KEY        = 'calvix_api_cfg';

const DEFAULT_SUPABASE = {
  url: 'https://mvhivbqfgteregyhmlhf.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12aGl2YnFmZ3RlcmVneWhtbGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODY4NzUsImV4cCI6MjA5NDM2Mjg3NX0.VOfoL-ZO5sNNu9GAEuGPelMOIEqLRSzgqsuzSkVCt1E',
};
const DEFAULT_API = {
  url: 'https://friendly-respect.up.railway.app',
  secret: 'calvix-crm-2025',
};

function loadSupaCfg() {
  try { const v = JSON.parse(localStorage.getItem(SUPABASE_KEY)); return v && v.url ? v : DEFAULT_SUPABASE; }
  catch { return DEFAULT_SUPABASE; }
}
function loadApiCfg() {
  try { const v = JSON.parse(localStorage.getItem(API_KEY)); return v && v.url ? v : DEFAULT_API; }
  catch { return DEFAULT_API; }
}

// ── Date helpers ───────────────────────────────────────────────────────────────
const todayISO = () => new Date().toISOString().slice(0,10);
const weekAgo  = () => { const d=new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); };
const monthAgo = () => { const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10); };
function fmtDate(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
  catch { return s; }
}

// ── Toast Component ────────────────────────────────────────────────────────────
function Toasts({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = React.useState([]);
  const add = React.useCallback((msg, type='success') => {
    const id = Date.now();
    setToasts(p => [...p, {id, msg, type}]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
  }, []);
  return { toasts, toast: add };
}

// ── Spinner ────────────────────────────────────────────────────────────────────
const Spinner = ({text='Загрузка...'}) => (
  <div className="loader"><div className="spin"/>{text}</div>
);

// ── KPI Card ───────────────────────────────────────────────────────────────────
function KpiCard({label, value, emoji, color, bg}) {
  return (
    <div className="kpi-card" style={{'--kpi-color':color,'--kpi-bg':bg}}>
      <div className="kpi-icon-wrap">{emoji}</div>
      <div className="kpi-label">{label}</div>
      <div className={`kpi-value${value===null?' loading':''}`}>
        {value === null ? '...' : value}
      </div>
    </div>
  );
}

// ── Tab 1: Dashboard ───────────────────────────────────────────────────────────
function DashboardTab({ supaClient }) {
  const [hotLeads, setHotLeads] = React.useState([]);
  const [bookings, setBookings] = React.useState([]);
  const [totals,   setTotals]   = React.useState({hot:null,book:null,hotToday:null,bookToday:null});
  const [loading,  setLoading]  = React.useState(false);
  const [error,    setError]    = React.useState(null);
  const [period,   setPeriod]   = React.useState('week');
  const [bizFilter,setBiz]      = React.useState('all');
  const [lastRef,  setLastRef]  = React.useState(null);

  const fetchData = React.useCallback(async () => {
    if (!supaClient) return;
    setLoading(true); setError(null);
    try {
      const dateFrom = period==='today' ? todayISO() : period==='week' ? weekAgo() : period==='month' ? monthAgo() : null;
      let hq = supaClient.from('hot_leads')
        .select('id,business_name,full_name,username,phone,last_message,trigger_word,status,created_at')
        .order('created_at',{ascending:false});
      let bq = supaClient.from('bookings')
        .select('id,business_name,full_name,username,phone,scheduled_datetime,created_at')
        .order('created_at',{ascending:false});
      if (dateFrom) { hq = hq.gte('created_at', dateFrom); bq = bq.gte('created_at', dateFrom); }
      if (bizFilter !== 'all') { hq = hq.eq('business_name', bizFilter); bq = bq.eq('business_name', bizFilter); }
      const [h, b] = await Promise.all([hq, bq]);
      if (h.error) throw new Error(h.error.message || JSON.stringify(h.error));
      if (b.error) throw new Error(b.error.message || JSON.stringify(b.error));
      setHotLeads(h.data || []);
      setBookings(b.data || []);
      setLastRef(new Date());
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [supaClient, period, bizFilter]);

  // totals (all-time, unfiltered)
  React.useEffect(() => {
    if (!supaClient) return;
    const today = todayISO();
    Promise.all([
      supaClient.from('hot_leads').select('*',{count:'exact',head:true}),
      supaClient.from('bookings').select('*',{count:'exact',head:true}),
      supaClient.from('hot_leads').select('*',{count:'exact',head:true}).gte('created_at',today),
      supaClient.from('bookings').select('*',{count:'exact',head:true}).gte('created_at',today),
    ]).then(([h,b,ht,bt]) => {
      setTotals({hot:h.count??0, book:b.count??0, hotToday:ht.count??0, bookToday:bt.count??0});
    });
  }, [supaClient]);

  React.useEffect(() => { fetchData(); }, [fetchData]);

  // auto-refresh every 30s
  React.useEffect(() => {
    const id = setInterval(fetchData, 30000);
    return () => clearInterval(id);
  }, [fetchData]);

  const businesses = React.useMemo(() => {
    const all = [...hotLeads,...bookings].map(r=>r.business_name).filter(Boolean);
    return [...new Set(all)].sort();
  }, [hotLeads, bookings]);

  if (!supaClient) {
    return (
      <div className="page">
        <div className="no-cfg">
          <h3>Supabase не настроен</h3>
          <p>Перейдите во вкладку «Настройки» и укажите URL и ключ Supabase.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      {error && (
        <div className="err-box">
          <div className="err-title">⚠ Ошибка загрузки</div>
          <div className="err-detail">{error}</div>
          <div className="err-hint">
            Проверьте: URL и anon key; наличие таблиц <code>hot_leads</code> и <code>bookings</code>;
            политику RLS (анонимный SELECT должен быть разрешён).
          </div>
        </div>
      )}

      {/* KPI */}
      <div className="kpi-grid">
        <KpiCard label="🔥 HOT лиды сегодня"    value={totals.hotToday}  emoji="🔥" color="var(--c-orange)" bg="var(--c-orange-bg)"/>
        <KpiCard label="📅 Записей сегодня"      value={totals.bookToday} emoji="📅" color="var(--c-blue)"   bg="var(--c-blue-bg)"/>
        <KpiCard label="🔥 HOT всего"            value={totals.hot}       emoji="🔥" color="var(--c-red)"    bg="var(--c-red-bg)"/>
        <KpiCard label="📅 Записей всего"        value={totals.book}      emoji="📅" color="var(--c-green)"  bg="var(--c-green-bg)"/>
      </div>

      {/* Filter bar */}
      <div className="filter-bar">
        <span className="filter-label">Бизнес:</span>
        <select className="sel" value={bizFilter} onChange={e=>setBiz(e.target.value)}>
          <option value="all">Все бизнесы</option>
          {businesses.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
        <span className="filter-label" style={{marginLeft:8}}>Период:</span>
        <div className="seg">
          {[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время']].map(([v,l])=>(
            <button key={v} className={period===v?'on':''} onClick={()=>setPeriod(v)}>{l}</button>
          ))}
        </div>
        <div className="spacer"/>
        <button className="btn-refresh" onClick={fetchData}>
          ↻ Обновить
          {lastRef && <span style={{color:'var(--ink-4)',fontSize:11}}>{lastRef.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span>}
        </button>
      </div>

      {/* HOT Leads table */}
      <div className="section">
        <div className="section-hd">
          <div className="section-title">🔥 HOT Лиды</div>
          <span className="count-badge">{hotLeads.length}</span>
        </div>
        <div className="table-card">
          {loading
            ? <Spinner/>
            : <div className="table-scroll">
                <table>
                  <thead><tr>
                    <th>Бизнес</th><th>Клиент</th><th>Username</th><th>Телефон</th>
                    <th>Сообщение</th><th>Триггер</th><th>Статус</th><th>Дата</th>
                  </tr></thead>
                  <tbody>
                    {hotLeads.length === 0
                      ? <tr className="empty-row"><td colSpan="8">Нет данных за выбранный период</td></tr>
                      : hotLeads.map((r,i) => (
                          <tr key={r.id||i}>
                            <td><span className="chip-biz">{r.business_name||'—'}</span></td>
                            <td className="td-name">{r.full_name||'—'}</td>
                            <td className="td-nick">{r.username ? `@${r.username.replace(/^@/,'')}` : '—'}</td>
                            <td className="td-phone">{r.phone||'—'}</td>
                            <td className="td-msg" title={r.last_message||''}>{r.last_message||'—'}</td>
                            <td>{r.trigger_word ? <span className="chip-trigger">🎯 {r.trigger_word}</span> : <span style={{color:'var(--ink-4)'}}>—</span>}</td>
                            <td>{r.status ? <span style={{fontSize:11.5,color:'var(--ink-3)'}}>{r.status}</span> : '—'}</td>
                            <td className="td-date">{fmtDate(r.created_at)}</td>
                          </tr>
                        ))
                    }
                  </tbody>
                </table>
              </div>
          }
        </div>
      </div>

      {/* Bookings table */}
      <div className="section">
        <div className="section-hd">
          <div className="section-title">📅 Записи на созвон</div>
          <span className="count-badge">{bookings.length}</span>
        </div>
        <div className="table-card">
          {loading
            ? <Spinner/>
            : <div className="table-scroll">
                <table>
                  <thead><tr>
                    <th>Бизнес</th><th>Клиент</th><th>Username</th>
                    <th>Телефон</th><th>Время</th><th>Дата</th>
                  </tr></thead>
                  <tbody>
                    {bookings.length === 0
                      ? <tr className="empty-row"><td colSpan="6">Нет данных за выбранный период</td></tr>
                      : bookings.map((r,i) => (
                          <tr key={r.id||i}>
                            <td><span className="chip-biz">{r.business_name||'—'}</span></td>
                            <td className="td-name">{r.full_name||'—'}</td>
                            <td className="td-nick">{r.username ? `@${r.username.replace(/^@/,'')}` : '—'}</td>
                            <td className="td-phone">{r.phone||'—'}</td>
                            <td className="td-time">{r.scheduled_datetime||'—'}</td>
                            <td className="td-date">{fmtDate(r.created_at)}</td>
                          </tr>
                        ))
                    }
                  </tbody>
                </table>
              </div>
          }
        </div>
      </div>
    </div>
  );
}

// ── Tab 2: Bots / CRM ──────────────────────────────────────────────────────────
const EMPTY_FORM = {
  business_name: '',
  token: '',
  system_prompt: '',
  welcome_message: '',
  manager_link: '@akovpyat',
  is_active: true,
};

function BotsTab({ apiCfg, toast }) {
  const [bots,      setBots]    = React.useState([]);
  const [loading,   setLoading] = React.useState(false);
  const [saving,    setSaving]  = React.useState(false);
  const [deleting,  setDeleting]= React.useState(null);
  const [error,     setError]   = React.useState(null);
  const [selected,  setSelected]= React.useState(null); // bot id being edited
  const [form,      setForm]    = React.useState(EMPTY_FORM);
  const [isNew,     setIsNew]   = React.useState(false);

  const { url: apiUrl, secret: apiSecret } = apiCfg;

  const apiFetch = React.useCallback(async (path, opts={}) => {
    if (!apiUrl) throw new Error('API URL не настроен. Перейдите в Настройки.');
    const res = await fetch(`${apiUrl}${path}`, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'X-API-Secret': apiSecret || '',
        ...(opts.headers||{}),
      },
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) {
      const msg = (data && (data.detail || data.message || data.error)) || `HTTP ${res.status}`;
      throw new Error(msg);
    }
    return data;
  }, [apiUrl, apiSecret]);

  const loadBots = React.useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiFetch('/api/businesses');
      setBots(Array.isArray(data) ? data : (data.businesses || data.data || []));
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [apiFetch]);

  React.useEffect(() => { loadBots(); }, [loadBots]);

  function openNew() {
    setIsNew(true);
    setSelected(null);
    setForm(EMPTY_FORM);
  }

  function openEdit(bot) {
    setIsNew(false);
    setSelected(bot.id);
    setForm({
      business_name:   bot.business_name || '',
      token:           bot.token || '',
      system_prompt:   bot.system_prompt || '',
      welcome_message: bot.welcome_message || '',
      manager_link:    bot.manager_link || '@akovpyat',
      is_active:       bot.is_active !== false,
    });
  }

  function closeForm() {
    setIsNew(false);
    setSelected(null);
  }

  function setField(k, v) {
    setForm(p => ({...p, [k]: v}));
  }

  async function handleSave(e) {
    e.preventDefault();
    if (!form.business_name.trim()) { toast('Введите название бизнеса', 'error'); return; }
    if (!form.token.trim())          { toast('Введите токен бота', 'error'); return; }
    if (!form.system_prompt.trim())  { toast('Введите системный промпт', 'error'); return; }
    setSaving(true);
    try {
      if (isNew) {
        await apiFetch('/api/businesses', { method: 'POST', body: JSON.stringify(form) });
        toast('Бот добавлен успешно');
      } else {
        await apiFetch(`/api/businesses/${selected}`, { method: 'PUT', body: JSON.stringify(form) });
        toast('Бот обновлён');
      }
      // reload live
      try { await apiFetch('/api/reload', { method: 'POST' }); } catch {}
      await loadBots();
      closeForm();
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      setSaving(false);
    }
  }

  async function handleDelete(bot) {
    if (!confirm(`Удалить бота «${bot.business_name}»? Это действие нельзя отменить.`)) return;
    setDeleting(bot.id);
    try {
      await apiFetch(`/api/businesses/${bot.id}`, { method: 'DELETE' });
      try { await apiFetch('/api/reload', { method: 'POST' }); } catch {}
      toast('Бот удалён');
      if (selected === bot.id) closeForm();
      await loadBots();
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      setDeleting(null);
    }
  }

  async function handleToggleActive(bot) {
    try {
      await apiFetch(`/api/businesses/${bot.id}`, {
        method: 'PUT',
        body: JSON.stringify({ ...bot, is_active: !bot.is_active }),
      });
      try { await apiFetch('/api/reload', { method: 'POST' }); } catch {}
      toast(bot.is_active ? 'Бот деактивирован' : 'Бот активирован');
      await loadBots();
    } catch(e) {
      toast(e.message, 'error');
    }
  }

  const showForm = isNew || selected !== null;

  if (!apiUrl) {
    return (
      <div className="page">
        <div className="no-cfg">
          <h3>Railway API не настроен</h3>
          <p>Перейдите во вкладку «Настройки» и укажите URL и секрет Railway CRM API.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="page">
      {error && (
        <div className="err-box">
          <div className="err-title">⚠ Ошибка подключения к API</div>
          <div className="err-detail">{error}</div>
          <div className="err-hint">Проверьте URL и секрет в Настройках, а также доступность Railway сервиса.</div>
        </div>
      )}

      <div className="bots-layout">
        {/* Left: bot list */}
        <div className="bots-panel">
          <div className="bots-panel-hd">
            <span className="bots-panel-title">Боты ({bots.length})</span>
            <button className="btn btn-primary" style={{padding:'6px 14px',fontSize:12}} onClick={openNew}>
              + Добавить
            </button>
          </div>

          {loading && <Spinner text="Загрузка ботов..."/>}

          {!loading && bots.length === 0 && (
            <div className="bots-empty">
              <div className="bots-empty-icon">🤖</div>
              <div className="bots-empty-text">У вас пока нет ботов.<br/>Добавьте первого!</div>
              <button className="btn btn-primary" onClick={openNew}>+ Добавить бота</button>
            </div>
          )}

          {!loading && bots.map(bot => (
            <div
              key={bot.id}
              className={`bot-card${selected===bot.id?' selected':''}`}
              onClick={() => openEdit(bot)}
            >
              <div className="bot-card-hd">
                <span className="bot-card-name">{bot.business_name}</span>
                <span className={bot.is_active ? 'badge-active' : 'badge-inactive'}>
                  {bot.is_active ? 'Активен' : 'Выключен'}
                </span>
              </div>
              {bot.username && <div className="bot-card-username">@{bot.username.replace(/^@/,'')}</div>}
              <div className="bot-card-prompt">
                {(bot.system_prompt||'').slice(0,80)}{(bot.system_prompt||'').length>80?'…':''}
              </div>
              <div className="bot-card-actions" onClick={e=>e.stopPropagation()}>
                <button className="btn-ghost-sm" onClick={()=>openEdit(bot)}>✏️ Редактировать</button>
                <button
                  className="btn-ghost-sm"
                  onClick={()=>handleToggleActive(bot)}
                  title={bot.is_active ? 'Деактивировать' : 'Активировать'}
                >
                  {bot.is_active ? '⏸ Стоп' : '▶ Старт'}
                </button>
                <button
                  className="btn-danger-sm"
                  onClick={()=>handleDelete(bot)}
                  disabled={deleting===bot.id}
                >
                  {deleting===bot.id ? '...' : '🗑️'}
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* Right: form */}
        {showForm
          ? (
            <div className="bot-form-card">
              <div className="bot-form-hd">
                <span className="bot-form-title">{isNew ? '+ Новый бот' : `Редактировать: ${form.business_name}`}</span>
                <button className="btn-ghost-sm" onClick={closeForm}>✕ Отмена</button>
              </div>
              <form onSubmit={handleSave}>
                <div className="bot-form-body">
                  <div className="bot-form-row">
                    <div className="field">
                      <label>Название бизнеса *</label>
                      <input
                        type="text" required
                        placeholder="Мой бизнес"
                        value={form.business_name}
                        onChange={e=>setField('business_name',e.target.value)}
                      />
                    </div>
                    <div className="field">
                      <label>Токен Telegram-бота *</label>
                      <input
                        type="text" required
                        placeholder="123456789:AAF..."
                        value={form.token}
                        onChange={e=>setField('token',e.target.value)}
                      />
                    </div>
                  </div>

                  <div className="field">
                    <label>Характер и инструкции для AI *</label>
                    <textarea
                      rows="8" required
                      placeholder="Ты — AI-ассистент компании... Твоя задача..."
                      value={form.system_prompt}
                      onChange={e=>setField('system_prompt',e.target.value)}
                      style={{minHeight:200}}
                    />
                    <div className="note">Детальные инструкции: характер бота, что делать, чего не делать, как отвечать на вопросы.</div>
                  </div>

                  <div className="field">
                    <label>Первое сообщение при /start</label>
                    <textarea
                      rows="3"
                      placeholder="Привет! Я AI-ассистент компании..."
                      value={form.welcome_message}
                      onChange={e=>setField('welcome_message',e.target.value)}
                    />
                    <div className="note">Необязательно. Если пусто — бот начинает отвечать с первого сообщения пользователя.</div>
                  </div>

                  <div className="bot-form-row">
                    <div className="field">
                      <label>Ссылка на менеджера</label>
                      <input
                        type="text"
                        placeholder="@username"
                        value={form.manager_link}
                        onChange={e=>setField('manager_link',e.target.value)}
                      />
                      <div className="note">Telegram-ник менеджера для передачи горячих лидов.</div>
                    </div>
                    <div className="field" style={{display:'flex',alignItems:'flex-end',paddingBottom:8}}>
                      <div className="toggle-wrap">
                        <label className="toggle">
                          <input
                            type="checkbox"
                            checked={form.is_active}
                            onChange={e=>setField('is_active',e.target.checked)}
                          />
                          <span className="toggle-slider"/>
                        </label>
                        <span className="toggle-label">
                          {form.is_active ? 'Бот активен' : 'Бот выключен'}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bot-form-footer">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    {saving ? '...' : (isNew ? '✓ Создать бота' : '✓ Сохранить')}
                  </button>
                  <button type="button" className="btn btn-outline" onClick={closeForm}>Отмена</button>
                  <div className="spacer"/>
                  {!isNew && (
                    <button
                      type="button" className="btn btn-danger"
                      onClick={()=>handleDelete({id:selected,business_name:form.business_name})}
                      disabled={!!deleting}
                    >
                      🗑️ Удалить
                    </button>
                  )}
                </div>
              </form>
            </div>
          )
          : (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'60px 24px'}}>
              <div style={{textAlign:'center',color:'var(--ink-4)'}}>
                <div style={{fontSize:48,marginBottom:12}}>👈</div>
                <div style={{fontSize:13}}>Выберите бота для редактирования<br/>или добавьте нового.</div>
              </div>
            </div>
          )
        }
      </div>
    </div>
  );
}

// ── Tab 3: Settings ────────────────────────────────────────────────────────────
function SettingsTab({ supaCfg, apiCfg, onSupaSave, onApiSave }) {
  const [supaUrl, setSupaUrl]     = React.useState(supaCfg.url || '');
  const [supaKey, setSupaKey]     = React.useState(supaCfg.key || '');
  const [apiUrl,  setApiUrl]      = React.useState(apiCfg.url || '');
  const [apiSec,  setApiSec]      = React.useState(apiCfg.secret || '');
  const [supaSaved,setSupaSaved]  = React.useState(false);
  const [apiSaved, setApiSaved]   = React.useState(false);

  function saveSupabase() {
    const cfg = { url: supaUrl.trim(), key: supaKey.trim() };
    localStorage.setItem(SUPABASE_KEY, JSON.stringify(cfg));
    onSupaSave(cfg);
    setSupaSaved(true);
    setTimeout(() => setSupaSaved(false), 2500);
  }

  function saveApi() {
    const cfg = { url: apiUrl.trim(), secret: apiSec.trim() };
    localStorage.setItem(API_KEY, JSON.stringify(cfg));
    onApiSave(cfg);
    setApiSaved(true);
    setTimeout(() => setApiSaved(false), 2500);
  }

  return (
    <div className="page">
      <div style={{marginBottom:20}}>
        <div style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em',marginBottom:4}}>⚙️ Настройки</div>
        <div style={{fontSize:12.5,color:'var(--ink-3)'}}>Подключения к Supabase и Railway CRM API</div>
      </div>

      <div className="settings-grid">
        {/* Supabase card */}
        <div className="settings-card">
          <h3>
            <span style={{fontSize:20}}>🗄️</span>
            Supabase
          </h3>
          <div className="sub">
            Настройки базы данных для хранения лидов и записей.<br/>
            Найдите их в <strong>Supabase Dashboard → Settings → API</strong>.
          </div>

          <div className="field">
            <label>Project URL</label>
            <input
              type="url"
              placeholder="https://xxxxxxxxxxxx.supabase.co"
              value={supaUrl}
              onChange={e=>setSupaUrl(e.target.value)}
            />
          </div>
          <div className="field">
            <label>Anon Public Key</label>
            <textarea
              rows="4"
              placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              value={supaKey}
              onChange={e=>setSupaKey(e.target.value)}
              style={{fontFamily:'monospace',fontSize:11.5,resize:'vertical'}}
            />
            <div className="note">Публичный anon ключ (не service_role!).</div>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:12,marginTop:4}}>
            <button className="btn btn-primary" onClick={saveSupabase}>
              ✓ Сохранить
            </button>
            {supaSaved && <span className="settings-saved">✓ Сохранено!</span>}
          </div>
        </div>

        {/* Railway API card */}
        <div className="settings-card">
          <h3>
            <span style={{fontSize:20}}>🚂</span>
            Railway CRM API
          </h3>
          <div className="sub">
            URL вашего CRM-сервиса на Railway и секретный ключ.<br/>
            <strong>Railway Dashboard → ваш сервис → Settings → Domains</strong>
          </div>

          <div className="field">
            <label>API URL</label>
            <input
              type="url"
              placeholder="https://friendly-respect.up.railway.app"
              value={apiUrl}
              onChange={e=>setApiUrl(e.target.value)}
            />
            <div className="note">Публичный URL сервиса из Railway (без слеша в конце).</div>
          </div>
          <div className="field">
            <label>API Secret</label>
            <input
              type="text"
              placeholder="calvix-crm-2025"
              value={apiSec}
              onChange={e=>setApiSec(e.target.value)}
              style={{fontFamily:'monospace'}}
            />
            <div className="note">Секрет из переменной среды <code>API_SECRET</code> на Railway.</div>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:12,marginTop:4}}>
            <button className="btn btn-primary" onClick={saveApi}>
              ✓ Сохранить
            </button>
            {apiSaved && <span className="settings-saved">✓ Сохранено!</span>}
          </div>
        </div>
      </div>

      {/* Info box */}
      <div style={{
        marginTop:20, padding:'16px 20px',
        background:'rgba(26,107,60,.05)', border:'1px solid rgba(26,107,60,.15)',
        borderRadius:'var(--radius-sm)',
        fontSize:12.5, color:'var(--ink-2)', lineHeight:1.7,
      }}>
        <strong>Важно:</strong> настройки сохраняются в <code>localStorage</code> вашего браузера.
        При очистке данных браузера потребуется ввести их повторно.
        Ключи не передаются на сторонние серверы — все запросы идут напрямую с вашего браузера.
      </div>
    </div>
  );
}

// ── Root App ───────────────────────────────────────────────────────────────────
function App() {
  const [tab,      setTab]     = React.useState('dashboard');
  const [supaCfg,  setSupaCfg] = React.useState(loadSupaCfg);
  const [apiCfg,   setApiCfg]  = React.useState(loadApiCfg);
  const { toasts, toast }      = useToast();

  const supaClient = React.useMemo(() => {
    if (supaCfg.url && supaCfg.key) {
      try { return createClient(supaCfg.url, supaCfg.key); }
      catch { return null; }
    }
    return null;
  }, [supaCfg.url, supaCfg.key]);

  function handleSupaSave(cfg) {
    setSupaCfg(cfg);
    toast('Supabase настройки сохранены');
  }
  function handleApiSave(cfg) {
    setApiCfg(cfg);
    toast('Railway API настройки сохранены');
  }

  // switch to bots tab → ensure API cfg loaded fresh
  function switchTab(t) {
    setTab(t);
  }

  const TABS = [
    { id: 'dashboard', label: '📊 Дашборд' },
    { id: 'bots',      label: '🤖 Боты / CRM' },
    { id: 'settings',  label: '⚙️ Настройки' },
  ];

  return (
    <div className="shell">
      <Toasts toasts={toasts}/>

      {/* Header */}
      <header className="header">
        <div className="header-inner">
          {/* Logo */}
          <div className="logo-wrap">
            <div className="logo-mark">C</div>
            <div>
              <div className="logo-text">Calvix <em>AI</em></div>
              <div className="logo-sub">Sales Bot Platform</div>
            </div>
          </div>

          {/* Nav */}
          <nav className="nav-tabs">
            {TABS.map(t => (
              <button
                key={t.id}
                className={`nav-tab${tab===t.id?' active':''}`}
                onClick={() => switchTab(t.id)}
              >
                {t.label}
              </button>
            ))}
          </nav>

          {/* Live badge */}
          <div className="live-badge">
            <span className="live-dot"/>
            live
          </div>
        </div>
      </header>

      {/* Tab content */}
      {tab === 'dashboard' && <DashboardTab supaClient={supaClient}/>}
      {tab === 'bots'      && <BotsTab apiCfg={apiCfg} toast={toast}/>}
      {tab === 'settings'  && (
        <SettingsTab
          supaCfg={supaCfg} apiCfg={apiCfg}
          onSupaSave={handleSupaSave} onApiSave={handleApiSave}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
