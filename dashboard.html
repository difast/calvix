<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calvix AI · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg-page:   #f4f6f5;
  --bg-card:   #ffffff;
  --bg-hover:  #f0f7f4;
  --bg-dg:     #0d2b1f;
  --bg-dg2:    #12382a;
  --line:      #e2ece7;
  --ink:       #0d2b1f;
  --ink-2:     #2d5244;
  --ink-3:     #6b9080;
  --ink-4:     #a8c4b8;
  --inv-2:     rgba(255,255,255,.7);
  --inv-3:     rgba(255,255,255,.4);

  --c1:#16a34a; --c1d:rgba(22,163,74,.1);  --c1b:rgba(22,163,74,.25);
  --c2:#6366f1; --c2d:rgba(99,102,241,.1); --c2b:rgba(99,102,241,.25);
  --c3:#f97316; --c3d:rgba(249,115,22,.1); --c3b:rgba(249,115,22,.25);
  --c4:#0ea5e9; --c4d:rgba(14,165,233,.1); --c4b:rgba(14,165,233,.25);
  --c5:#ec4899; --c5d:rgba(236,72,153,.1); --c5b:rgba(236,72,153,.25);
  --danger:#dc2626; --danger-lt:#fff5f5; --danger-line:#fecaca;

  --accent:#16a34a; --accent-glow:rgba(22,163,74,.3);
  --radius:12px; --radius-sm:7px;
  --shadow:0 1px 3px rgba(13,43,31,.06),0 4px 16px rgba(13,43,31,.06);
  --shadow-lg:0 8px 32px rgba(13,43,31,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg-page); color:var(--ink);
  font-family:"Geist",ui-sans-serif,system-ui,sans-serif;
  font-size:13px; line-height:1.5; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-feature-settings:"tnum" 1;}
.shell{min-height:100vh;display:flex;flex-direction:column;}

/* ── Header ── */
.header{
  background:var(--bg-dg); padding:0 32px; height:60px;
  display:flex; align-items:center;
  position:sticky; top:0; z-index:20;
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.header-inner{
  max-width:1440px; width:100%; margin:0 auto;
  display:flex; align-items:center; justify-content:flex-start; position:relative;
}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#1db954,#0d7a38);
  display:grid;place-items:center;
  font-weight:700;font-size:15px;color:#fff;letter-spacing:-.02em;
  box-shadow:0 2px 8px rgba(29,185,84,.4);
}
.logo-text{font-size:16px;font-weight:700;letter-spacing:-.03em;color:#fff;}
.logo-text span{color:#4ade80;}
.logo-sub{font-size:10.5px;color:var(--inv-3);margin-top:1px;}
.header-right{
  position:absolute;right:0;
  display:flex;align-items:center;gap:8px;
}
.live-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--inv-3);}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-btn{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:var(--inv-2);font:inherit;font-size:12px;cursor:pointer;
  transition:background .15s,color .15s;
}
.hdr-btn:hover{background:rgba(255,255,255,.18);color:#fff;}

/* ── Controls bar ── */
.controls{
  background:var(--bg-dg2);padding:10px 32px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.controls-inner{
  max-width:1440px;width:100%;margin:0 auto;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.ctrl-label{font-size:11.5px;color:var(--inv-3);}
select.sel{
  appearance:none;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:var(--radius-sm);color:#fff;font:inherit;font-size:12.5px;
  padding:6px 28px 6px 10px;cursor:pointer;outline:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='rgba(255,255,255,.4)' d='M0 0h10L5 6z'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;
  min-width:180px;
}
select.sel:focus{border-color:#4ade80;}
select.sel option{background:#0d2b1f;color:#fff;}
.seg{
  display:inline-flex;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);
  padding:2px;gap:2px;
}
.seg button{
  background:transparent;border:0;color:var(--inv-3);
  font:inherit;font-size:12px;font-weight:500;
  padding:4px 13px;border-radius:5px;cursor:pointer;
  transition:background .12s,color .12s;
}
.seg button.on{background:#16a34a;color:#fff;font-weight:600;}
.ctrl-spacer{flex:1;}

/* ── Nav tabs ── */
.nav-bar{
  background:var(--bg-card);border-bottom:1px solid var(--line);
  padding:0 32px; position:sticky; top:60px; z-index:10;
}
.nav-bar-inner{max-width:1440px;margin:0 auto;display:flex;gap:0;}
.nav-tab{
  padding:12px 18px;font:inherit;font-size:13px;font-weight:500;
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink-3);cursor:pointer;transition:color .15s,border-color .15s;
  white-space:nowrap;
}
.nav-tab:hover{color:var(--ink-2);}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

/* ── Page ── */
.page{max-width:1440px;margin:0 auto;padding:24px 32px 56px;}

/* ── KPI grid ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
@media(max-width:960px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 20px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;cursor:default;
}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(13,43,31,.13);border-color:var(--kpi-color);}
.stat-mini{transition:transform .18s ease,box-shadow .18s ease,background .18s ease;}
.stat-mini:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(13,43,31,.11);}
.analytics-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.analytics-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(13,43,31,.12);border-color:rgba(22,163,74,.3);}
.biz-card{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
.biz-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(13,43,31,.1);border-color:rgba(22,163,74,.4);}
/* ── Profile dropdown ── */
.profile-btn{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius-sm);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--inv-2);font:inherit;font-size:12px;cursor:pointer;transition:background .15s;}
.profile-btn:hover{background:rgba(255,255,255,.18);}
.profile-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1db954,#0d7a38);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(29,185,84,.3);}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:210px;z-index:50;overflow:hidden;animation:fadeIn .15s ease;}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font:inherit;font-size:13px;background:transparent;border:0;cursor:pointer;color:var(--ink-2);width:100%;text-align:left;transition:background .1s;}
.dropdown-item:hover{background:var(--bg-hover);}
.dropdown-sep{height:1px;background:var(--line);margin:4px 0;}
.page{animation:fadeIn .18s ease;}
.user-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;}
.user-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(13,43,31,.12);border-color:rgba(22,163,74,.35);}
.kpi-card::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  border-top:3px solid var(--kpi-color);pointer-events:none;
}
.kpi-icon{width:38px;height:38px;border-radius:10px;background:var(--kpi-bg);display:grid;place-items:center;font-size:18px;margin-bottom:14px;}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500;margin-bottom:6px;}
.kpi-value{font-size:38px;font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ink);}
.kpi-value.loading{color:var(--ink-4);font-size:28px;}

/* ── Section ── */
.section{margin-bottom:22px;}
.section-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.section-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em;}
.count-badge{
  padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--bg-dg);color:#4ade80;border:1px solid rgba(74,222,128,.2);
}

/* ── Table ── */
.table-wrap{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);font-weight:600;
  padding:11px 16px;border-bottom:1px solid var(--line);
  background:#f8fbf9;white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr.clickable{cursor:pointer;transition:background .1s;}
tbody tr.clickable:hover td,tbody tr:hover td{background:var(--bg-hover);}
.td-name{color:var(--ink);font-weight:600;}
.td-phone{font-family:"Geist Mono",monospace;color:var(--ink-3);font-size:11.5px;}
.td-nick{color:var(--c1);font-family:"Geist Mono",monospace;font-size:12px;font-weight:500;}
.td-msg{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);}
.td-date{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap;}
.td-time{font-family:"Geist Mono",monospace;font-size:12px;color:var(--c2);font-weight:600;white-space:nowrap;}
.chip-biz{display:inline-flex;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:500;background:#f0faf4;color:var(--ink-2);border:1px solid var(--line);}
.chip-trigger{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--c3d);color:var(--c3);border:1px solid var(--c3b);white-space:nowrap;}
.empty-state{text-align:center;padding:44px;color:var(--ink-4);font-size:13px;}

/* ── Badge / Status ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-hot{background:#fff1f0;color:#cf1322;border:1px solid #ffa39e;}
.badge-warm{background:#fffbe6;color:#d48806;border:1px solid #ffe58f;}
.badge-cold{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd;}
.badge-pending{background:#fffbe6;color:#d48806;border:1px solid #ffe58f;}
.badge-done{background:#f0fdf4;color:#166534;border:1px solid #86efac;}
.badge-cancelled{background:#fff5f5;color:#991b1b;border:1px solid #fca5a5;}

/* ── Status buttons (inline) ── */
.status-btns{display:flex;gap:4px;}
.sbtn{padding:3px 8px;border-radius:999px;font:inherit;font-size:11px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:opacity .15s;opacity:.35;}
.sbtn.active{opacity:1;}
.sbtn:hover{opacity:.8;}
.sbtn-hot{background:#fff1f0;color:#cf1322;border-color:#ffa39e;}
.sbtn-warm{background:#fffbe6;color:#d48806;border-color:#ffe58f;}
.sbtn-cold{background:#f0f9ff;color:#0369a1;border-color:#bae6fd;}

/* ── Filters bar (light) ── */
.filters-bar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.filter-group{display:flex;flex-direction:column;gap:4px;}
.filter-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;}
.filter-input,.filter-select{
  height:34px;padding:0 10px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--bg-page);color:var(--ink);
  font:inherit;font-size:13px;outline:none;min-width:140px;transition:border-color .15s;
}
.filter-input:focus,.filter-select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,163,74,.1);}
.filters-actions{display:flex;gap:8px;margin-left:auto;align-items:flex-end;}

/* ── Export ── */
.export-row{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.export-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;
  border:1px solid var(--line);cursor:pointer;background:var(--bg-card);
  color:var(--ink-2);transition:background .15s;
}
.export-csv{border-color:#86efac;color:#166534;background:#f0fdf4;}
.export-csv:hover{background:#dcfce7;}
.export-xlsx{border-color:#93c5fd;color:#1e40af;background:#eff6ff;}
.export-xlsx:hover{background:#dbeafe;}
.export-pdf{border-color:#fca5a5;color:#991b1b;background:#fff5f5;}
.export-pdf:hover{background:#fee2e2;}
.leads-count{font-size:12px;color:var(--ink-3);margin-left:auto;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font:inherit;font-size:13px;font-weight:600;border:0;cursor:pointer;transition:opacity .15s,background .15s;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow);}
.btn-primary:hover:not(:disabled){opacity:.88;}
.btn-ghost{background:var(--bg-card);border:1px solid var(--line);color:var(--ink-2);}
.btn-ghost:hover:not(:disabled){background:var(--bg-page);}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);}
.page-btn{width:30px;height:30px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;background:var(--bg-page);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;color:var(--ink-2);transition:background .1s;}
.page-btn:hover:not(:disabled){background:var(--line);}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
.page-btn.cur{background:var(--accent);color:#fff;border-color:var(--accent);}
.page-info{font-size:12px;color:var(--ink-3);}

/* ── Spinner ── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:var(--ink-4);}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(13,43,31,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;}
.modal-hd-info{flex:1;min-width:0;}
.modal-hd-name{font-size:16px;font-weight:700;}
.modal-hd-meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
.modal-close{width:28px;height:28px;border-radius:6px;font:inherit;font-size:16px;background:var(--bg-page);border:1px solid var(--line);cursor:pointer;color:var(--ink-3);display:grid;place-items:center;flex-shrink:0;}
.modal-close:hover{background:var(--danger-lt);color:var(--danger);border-color:var(--danger-line);}
.modal-status{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.modal-status-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;}
.modal-body{flex:1;overflow-y:auto;padding:16px 24px;}
.modal-ft{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}

/* ── Chat ── */
.chat-list{display:flex;flex-direction:column;gap:10px;}
.chat-msg{display:flex;flex-direction:column;max-width:82%;}
.chat-msg.user{align-self:flex-end;align-items:flex-end;}
.chat-msg.assistant{align-self:flex-start;align-items:flex-start;}
.chat-bubble{padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.chat-msg.user .chat-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
.chat-msg.assistant .chat-bubble{background:var(--bg-page);border:1px solid var(--line);border-bottom-left-radius:3px;}
.chat-time{font-size:10.5px;color:var(--ink-4);margin-top:3px;padding:0 2px;}
.chat-empty{text-align:center;padding:32px;color:var(--ink-3);}

/* ── Auth ── */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2b1f,#12382a 50%,#0d2b1f);padding:24px;}
.auth-card{background:var(--bg-card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;overflow:hidden;}
.auth-card-hd{background:var(--bg-dg);padding:28px 32px 24px;text-align:center;}
.auth-logo-mark{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#1db954,#0d7a38);display:grid;place-items:center;margin:0 auto 14px;font-weight:800;font-size:24px;color:#fff;box-shadow:0 4px 16px rgba(29,185,84,.35);}
.auth-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.03em;}
.auth-title span{color:#4ade80;}
.auth-sub{font-size:12px;color:var(--inv-3);margin-top:4px;}
.auth-tabs{display:flex;background:rgba(255,255,255,.07);border-radius:8px;padding:3px;margin-top:18px;gap:2px;}
.auth-tab{flex:1;padding:7px;border-radius:6px;font:inherit;font-size:12.5px;font-weight:600;background:transparent;border:0;cursor:pointer;transition:background .15s,color .15s;color:var(--inv-3);}
.auth-tab.active{background:rgba(74,222,128,.2);color:#4ade80;}
.auth-body{padding:28px 32px;}
.auth-err{background:var(--danger-lt);border:1px solid var(--danger-line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--danger);margin-bottom:16px;}
.auth-divider{text-align:center;margin:20px 0;position:relative;}
.auth-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line);}
.auth-divider span{background:var(--bg-card);padding:0 12px;font-size:12px;color:var(--ink-4);position:relative;}

<script type="text/babel" data-presets="react">
const API_BASE  = '';
const AUTH_KEY  = 'calvix_auth_v2';

function loadAuth(){try{const v=JSON.parse(localStorage.getItem(AUTH_KEY));return(v&&(v.token||v.secret))?v:null;}catch{return null;}}
function saveAuth(a){localStorage.setItem(AUTH_KEY,JSON.stringify(a));}

function fmtDate(s){
  if(!s)return'—';
  try{return new Date(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});}
  catch{return s;}
}
function fmtDT(s){
  if(!s)return'—';
  try{return new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
  catch{return s;}
}
const todayISO=()=>new Date().toISOString().slice(0,10);
const weekAgo=()=>{const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);};
const monthAgo=()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);};

// ── Supabase REST helpers ──────────────────────────────────────────────────────
const SB_URL = 'https://mvhivbqfgteregyhmlhf.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12aGl2YnFmZ3RlcmVneWhtbGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODY4NzUsImV4cCI6MjA5NDM2Mjg3NX0.VOfoL-ZO5sNNu9GAEuGPelMOIEqLRSzgqsuzSkVCt1E';
const SB_H = {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`};

function _sbUrl(table, params){
  const u=new URL(`${SB_URL}/${table}`);
  Object.entries(params).forEach(([k,v])=>{
    if(v==null||v==='') return;
    if(Array.isArray(v)) v.forEach(vi=>u.searchParams.append(k,vi));
    else u.searchParams.append(k,String(v));
  });
  return u;
}
async function sbGet(table, params={}){
  try{
    const r=await fetch(_sbUrl(table,params),{headers:SB_H});
    const data=await r.json();
    if(!r.ok){console.error('[SB] Error',table,r.status,data?.message||data);return{data:[],count:0};}
    const arr=Array.isArray(data)?data:[];
    return{data:arr,count:arr.length};
  }catch(e){console.error('[SB] Fetch error',table,e);return{data:[],count:0};}
}
async function sbCount(table, params={}){
  try{
    const r=await fetch(_sbUrl(table,{...params,select:'count'}),{headers:SB_H});
    const data=await r.json();
    if(!r.ok){console.error('[SB] Count error',table,r.status,data?.message||data);return 0;}
    return parseInt(Array.isArray(data)&&data[0]?.count)||0;
  }catch(e){console.error('[SB] Count fetch error',table,e);return 0;}
}
async function sbGetPaged(table, params={}){
  try{
    const headers={...SB_H,'Prefer':'count=exact'};
    const r=await fetch(_sbUrl(table,params),{headers});
    const data=await r.json();
    if(!r.ok){console.error('[SB] Paged error',table,r.status,data?.message||data);return{data:[],count:0};}
    const cr=r.headers.get('content-range')||'';
    const total=parseInt((cr.split('/')[1])||'0')||0;
    return{data:Array.isArray(data)?data:[],count:total||data?.length||0};
  }catch(e){console.error('[SB] Paged fetch error',table,e);return{data:[],count:0};}
}
async function sbPatch(table, id, body){
  try{
    await fetch(`${SB_URL}/${table}?id=eq.${id}`,{
      method:'PATCH',headers:{...SB_H,'Content-Type':'application/json'},body:JSON.stringify(body)
    });
  }catch(e){console.error('[SB] Patch error',table,e);}
}

function authHeaders(auth,extra={}){
  const h={'Content-Type':'application/json',...extra};
  if(auth&&auth.secret) h['X-API-Secret']=auth.secret;
  else if(auth&&auth.token) h['Authorization']=`Bearer ${auth.token}`;
  return h;
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({onLogin}){
  const [mode,setMode]=React.useState('login'); // login | register | admin
  const [phone,setPhone]=React.useState('');
  const [pw,setPw]=React.useState('');
  const [name,setName]=React.useState('');
  const [adminPw,setAdminPw]=React.useState('');
  const [err,setErr]=React.useState('');
  const [loading,setLoading]=React.useState(false);

  async function submitUser(e){
    e.preventDefault();setErr('');setLoading(true);
    try{
      const body={phone:phone.trim(),password:pw};
      if(mode==='register') body.full_name=name;
      const r=await fetch(API_BASE+(mode==='register'?'/api/auth/register':'/api/auth/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Ошибка входа');
      onLogin({...d,role:'user'});
    }catch(e){setErr(e.message);}
    setLoading(false);
  }

  async function submitAdmin(e){
    e.preventDefault();setErr('');setLoading(true);
    try{
      const r=await fetch(API_BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adminPw})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Неверный пароль');
      onLogin({role:'admin',secret:d.secret});
    }catch(e){setErr(e.message);}
    setLoading(false);
  }

  return(
    <div className="auth-page">
      <div className="auth-card">
        <div className="auth-card-hd">
          <div className="auth-logo-mark">C</div>
          <div className="auth-title">Calvix <span>AI</span></div>
          <div className="auth-sub">Платформа управления AI‑продажами</div>
          {mode!=='admin'&&(
            <div className="auth-tabs">
              <button className={`auth-tab${mode==='login'?' active':''}`} onClick={()=>{setMode('login');setErr('');}}>Войти</button>
              <button className={`auth-tab${mode==='register'?' active':''}`} onClick={()=>{setMode('register');setErr('');}}>Регистрация</button>
            </div>
          )}
        </div>

        <div className="auth-body">
          {err&&<div className="auth-err">{err}</div>}

          {mode==='admin'?(
            <form onSubmit={submitAdmin}>
              <div style={{textAlign:'center',marginBottom:20}}>
                <div style={{width:44,height:44,borderRadius:12,background:'rgba(22,163,74,.12)',border:'1px solid rgba(22,163,74,.2)',display:'grid',placeItems:'center',fontSize:20,margin:'0 auto 10px'}}>🔑</div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--ink-2)'}}>Вход для администратора</div>
                <div style={{fontSize:12,color:'var(--ink-4)',marginTop:3}}>Полный доступ к платформе</div>
              </div>
              <div className="field">
                <label>Пароль администратора</label>
                <input type="password" value={adminPw} onChange={e=>setAdminPw(e.target.value)} autoFocus required placeholder="••••••••"/>
              </div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginBottom:14}} disabled={loading}>
                {loading?'Проверка…':'Войти как администратор'}
              </button>
              <button type="button" className="auth-admin-btn" onClick={()=>{setMode('login');setErr('');}}>← Назад</button>
            </form>
          ):(
            <form onSubmit={submitUser}>
              {mode==='register'&&(
                <div className="field">
                  <label>Имя</label>
                  <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Иван Иванов"/>
                </div>
              )}
              <div className="field">
                <label>Номер телефона</label>
                <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} required placeholder="+7 900 000 00 00" autoFocus/>
              </div>
              <div className="field">
                <label>Пароль</label>
                <input type="password" value={pw} onChange={e=>setPw(e.target.value)} required placeholder="••••••••"/>
              </div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginBottom:16}} disabled={loading}>
                {loading?'…':mode==='register'?'Создать аккаунт':'Войти'}
              </button>
              <div className="auth-divider"><span>или</span></div>
              <button type="button" className="auth-admin-btn" onClick={()=>{setMode('admin');setErr('');}}>
                🔑 Войти как администратор
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Lead History Modal ────────────────────────────────────────────────────────
function LeadHistoryModal({lead,auth,onClose,onStatusChange}){
  const [messages,setMessages]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [status,setStatus]=React.useState(lead.status||'COLD');
  const [bookingStatus,setBookingStatus]=React.useState(lead.booking_status||'pending');
  const [bookingActing,setBookingActing]=React.useState(false);
  const bodyRef=React.useRef(null);

  React.useEffect(()=>{
    fetch(API_BASE+`/api/leads/${lead.id}/history`,{headers:authHeaders(auth)})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(d=>{setMessages(Array.isArray(d)?d:[]);setLoading(false);})
      .catch(()=>{
        const fallback=lead.last_message?[{role:'user',content:lead.last_message,created_at:lead.created_at}]:[];
        setMessages(fallback);setLoading(false);
      });
  },[lead.id]);

  React.useEffect(()=>{if(!loading&&bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;},[loading,messages]);

  async function changeStatus(s){
    setStatus(s);
    sbPatch('hot_leads',lead.id,{status:s}).catch(()=>{});
    onStatusChange(lead.id,s);
  }

  async function changeBookingStatus(s){
    if(!lead.booking_id) return;
    setBookingActing(true);
    try{
      await fetch(API_BASE+`/api/bookings/${lead.booking_id}/status`,{method:'PUT',headers:authHeaders(auth),body:JSON.stringify({status:s})});
      setBookingStatus(s);
    }catch(e){}
    setBookingActing(false);
  }

  const name=lead.full_name||lead.username||`Лид #${lead.id}`;
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-hd">
          <div className="modal-hd-info">
            <div className="modal-hd-name">{name}</div>
            <div className="modal-hd-meta">
              {lead.username&&<>@{lead.username} · </>}
              {lead.phone&&<>{lead.phone} · </>}
              {lead.business_name} · создан {fmtDT(lead.created_at)}
            </div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-status">
          <span className="modal-status-label">Статус:</span>
          <div className="status-btns">
            {['HOT','WARM','COLD'].map(s=>(
              <button key={s} className={`sbtn sbtn-${s.toLowerCase()}${status===s?' active':''}`} onClick={()=>changeStatus(s)}>
                {s==='HOT'?'🔥 HOT':s==='WARM'?'⚡ WARM':'❄️ COLD'}
              </button>
            ))}
          </div>
        </div>
        {lead.scheduled_at&&(
          <div className="modal-status" style={{borderTop:'1px solid var(--line)',paddingTop:12,marginTop:0,gap:16,flexWrap:'wrap'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:13,color:'var(--ink-3)',fontWeight:500}}>📅 Звонок/встреча:</span>
              <span style={{fontWeight:700,color:'var(--c1)',fontSize:13}}>{fmtDT(lead.scheduled_at)}</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span className="modal-status-label">Статус:</span>
              {(()=>{
                const si={pending:{l:'Ожидает',c:'badge-pending'},done:{l:'Проведён',c:'badge-done'},cancelled:{l:'Отменён',c:'badge-cancelled'}};
                return <span className={`badge ${(si[bookingStatus]||si.pending).c}`}>{(si[bookingStatus]||si.pending).l}</span>;
              })()}
            </div>
            <div style={{display:'flex',gap:6}}>
              {bookingStatus==='pending'&&<>
                <button className="btn btn-primary btn-sm" style={{fontSize:11}} disabled={bookingActing} onClick={()=>changeBookingStatus('done')}>✅ Проведён</button>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)',borderColor:'var(--danger-line)',fontSize:11}} disabled={bookingActing} onClick={()=>changeBookingStatus('cancelled')}>❌ Отменить</button>
              </>}
              {bookingStatus!=='pending'&&<button className="btn btn-ghost btn-sm" style={{fontSize:11}} disabled={bookingActing} onClick={()=>changeBookingStatus('pending')}>↩ Вернуть</button>}
            </div>
          </div>
        )}
        <div className="modal-body" ref={bodyRef}>
          {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка диалога…</span></div>
          :messages.length===0?<div className="chat-empty">История диалога пуста</div>
          :<div className="chat-list">
            {messages.map((m,i)=>(
              <div key={i} className={`chat-msg ${m.role==='user'?'user':'assistant'}`}>
                <div className="chat-bubble">{m.content}</div>
                <div className="chat-time">{fmtDT(m.created_at)}</div>
              </div>
            ))}
          </div>}
        </div>
        <div className="modal-ft"><button className="btn btn-ghost btn-sm" onClick={onClose}>Закрыть</button></div>
      </div>
    </div>
  );
}

// ── Overview Tab ──────────────────────────────────────────────────────────────
function OverviewTab({auth,period,bizFilter,allBusinesses=[]}){
  const [kpi,setKpi]=React.useState({total:null,hot:null,bookings:null,today:null});
  const [hotLeads,setHotLeads]=React.useState([]);
  const [bookings,setBookings]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [platform,setPlatform]=React.useState(null);

  async function load(){
    setLoading(true);
    const dateFrom=period==='today'?todayISO():period==='week'?weekAgo():period==='month'?monthAgo():null;
    const bq=bizFilter?{business_name:`eq.${bizFilter}`}:{};
    const [cAll,cHot,cToday,cBook,rLeads,rBook,rPlatform]=await Promise.all([
      sbCount('hot_leads',{...bq}),
      sbCount('hot_leads',{...bq,status:'eq.HOT'}),
      sbCount('hot_leads',{...bq,'created_at':`gte.${todayISO()}`}),
      sbCount('bookings',{...bq}),
      sbGet('hot_leads',{select:'*',status:'eq.HOT',order:'created_at.desc',limit:10,...bq,...(dateFrom?{'created_at':`gte.${dateFrom}`}:{})}),
      sbGet('bookings',{select:'*',order:'created_at.desc',limit:10,...bq}),
      fetch(API_BASE+'/api/platform/status',{headers:authHeaders(auth)}).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    setKpi({total:cAll,hot:cHot,bookings:cBook,today:cToday});
    setHotLeads(rLeads.data);
    setBookings(rBook.data);
    setPlatform(rPlatform);
    setLoading(false);
  }

  React.useEffect(()=>{load();},[period,bizFilter]);

  const onlineIds=new Set((platform?.bots||[]).filter(b=>b.online).map(b=>b.id));

  return(
    <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:24,alignItems:'start'}}>
      <div>
        <div className="kpi-grid">
          <KpiCard label="Всего лидов"       value={kpi.total}    emoji="👥" color="var(--c4)" bg="var(--c4d)"/>
          <KpiCard label="HOT лидов"         value={kpi.hot}      emoji="🔥" color="var(--c3)" bg="var(--c3d)"/>
          <KpiCard label="Записей на созвон" value={kpi.bookings} emoji="📅" color="var(--c2)" bg="var(--c2d)"/>
          <KpiCard label="Новых сегодня"     value={kpi.today}    emoji="⚡" color="var(--c1)" bg="var(--c1d)"/>
        </div>

        <div className="section">
          <div className="section-hd">
            <div className="section-title">🔥 HOT Лиды</div>
            <span className="count-badge">{hotLeads.length}</span>
          </div>
          <div className="table-wrap">
            {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
            :<div className="table-scroll"><table>
              <thead><tr><th>Бизнес</th><th>Имя</th><th>Никнейм</th><th>Телефон</th><th>Создан</th></tr></thead>
              <tbody>
                {hotLeads.length===0?<tr><td className="empty-state" colSpan="5">Нет HOT лидов за период</td></tr>
                :hotLeads.map(r=>(
                  <tr key={r.id}>
                    <td><span className="chip-biz">{r.business_name||'—'}</span></td>
                    <td className="td-name">{r.full_name||'—'}</td>
                    <td className="td-nick">{r.username?`@${r.username}`:'—'}</td>
                    <td className="td-phone">{r.phone||'—'}</td>
                    <td className="td-date">{fmtDate(r.created_at)}</td>
                  </tr>
                ))}
              </tbody>
            </table></div>}
          </div>
        </div>

        <div className="section">
          <div className="section-hd">
            <div className="section-title">📅 Записи на созвон</div>
            <span className="count-badge">{bookings.length}</span>
          </div>
          <div className="table-wrap">
            {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
            :<div className="table-scroll"><table>
              <thead><tr><th>Бизнес</th><th>Имя</th><th>Телефон</th><th>Время созвона</th><th>Дата</th></tr></thead>
              <tbody>
                {bookings.length===0?<tr><td className="empty-state" colSpan="5">Нет записей</td></tr>
