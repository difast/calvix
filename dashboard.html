// ── Leads Tab ─────────────────────────────────────────────────────────────────
function LeadsTab({auth, bizLock}){
  const [leads,setLeads]=React.useState([]);
  const [total,setTotal]=React.useState(0);
  const [page,setPage]=React.useState(1);
  const [loading,setLoading]=React.useState(false);
  const [bizNames,setBizNames]=React.useState([]);
  const initF={business_name:bizLock||'',status:'',date_from:'',date_to:''};
  const [filters,setFilters]=React.useState(initF);
  const [pending,setPending]=React.useState(initF);
  const [selected,setSelected]=React.useState(null);
  const PER=25;
  const totalPages=Math.max(1,Math.ceil(total/PER));

  React.useEffect(()=>{
    if(bizLock) return; // no need to load all biz names when locked
    sbGet('hot_leads',{select:'business_name',order:'business_name.asc',limit:500})
      .then(({data})=>{setBizNames([...new Set(data.map(r=>r.business_name).filter(Boolean))]);})
      .catch(()=>{});
  },[]);

  React.useEffect(()=>{loadLeads();},[page,filters]);

  async function loadLeads(){
    setLoading(true);
    const p={select:'*',order:'created_at.desc',limit:PER,offset:(page-1)*PER};
    if(filters.business_name) p['business_name']=`eq.${filters.business_name}`;
    if(filters.status) p['status']=`eq.${filters.status}`;
    const dtArr=[];
    if(filters.date_from) dtArr.push(`gte.${filters.date_from}`);
    if(filters.date_to) dtArr.push(`lte.${filters.date_to}T23:59:59`);
    if(dtArr.length) p['created_at']=dtArr.length===1?dtArr[0]:dtArr;
    const {data,count}=await sbGetPaged('hot_leads',p);setLeads(data);setTotal(count);
    setLoading(false);
  }

  function applyFilters(){setPage(1);setFilters({...pending});}
  function resetFilters(){const e={business_name:'',status:'',date_from:'',date_to:''};setPending(e);setPage(1);setFilters(e);}

  function handleStatusChange(id,s){
    setLeads(prev=>prev.map(l=>l.id===id?{...l,status:s}:l));
    if(selected&&selected.id===id)setSelected(p=>({...p,status:s}));
  }

  async function updateStatus(id,s){
    handleStatusChange(id,s);
    await sbPatch('hot_leads',id,{status:s});
  }

  function exportCSV(){
    const header=['ID','Бизнес','Имя','Username','Телефон','Статус','Триггер','Создан'];
    const rows=leads.map(l=>[l.id,l.business_name||'',l.full_name||'',l.username||'',l.phone||'',l.status||'',l.trigger_word||'',fmtDT(l.created_at)]);
    const csv=[header,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads.csv';a.click();
  }
  function exportExcel(){
    const rows=[['ID','Бизнес','Имя','Username','Телефон','Статус','Триггер','Создан'],
      ...leads.map(l=>[l.id,l.business_name||'',l.full_name||'',l.username||'',l.phone||'',l.status||'',l.trigger_word||'',
        l.created_at?new Date(l.created_at).toLocaleString('ru'):''])];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Лиды');
    XLSX.writeFile(wb,'leads.xlsx');
  }
  function exportPDF(){
    const win=window.open('','_blank');
    const rows=leads.map(l=>`<tr><td>${l.id}</td><td>${l.business_name||''}</td><td>${l.full_name||''}</td><td>${l.username?'@'+l.username:''}</td><td>${l.phone||''}</td><td><b>${l.status||''}</b></td><td>${l.trigger_word||''}</td><td>${fmtDate(l.created_at)}</td></tr>`).join('');
    win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Лиды</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 8px}th{background:#f5f5f5}</style></head><body><h2>Лиды — Calvix AI</h2><table><thead><tr><th>#</th><th>Бизнес</th><th>Имя</th><th>Username</th><th>Телефон</th><th>Статус</th><th>Триггер</th><th>Дата</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
    win.document.close();win.print();
  }

  return(
    <div>
      <div className="filters-bar">
        {!bizLock&&<div className="filter-group">
          <span className="filter-label">Бизнес</span>
          <select className="filter-select" value={pending.business_name} onChange={e=>setPending(p=>({...p,business_name:e.target.value}))}>
            <option value="">Все бизнесы</option>
            {bizNames.map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </div>}
        <div className="filter-group">
          <span className="filter-label">Статус</span>
          <select className="filter-select" value={pending.status} onChange={e=>setPending(p=>({...p,status:e.target.value}))}>
            <option value="">Все</option>
            <option value="HOT">🔥 HOT</option>
            <option value="WARM">⚡ WARM</option>
            <option value="COLD">❄️ COLD</option>
          </select>
        </div>
        <div className="filter-group">
          <span className="filter-label">Дата от</span>
          <input type="date" className="filter-input" value={pending.date_from} onChange={e=>setPending(p=>({...p,date_from:e.target.value}))}/>
        </div>
        <div className="filter-group">
          <span className="filter-label">Дата до</span>
          <input type="date" className="filter-input" value={pending.date_to} onChange={e=>setPending(p=>({...p,date_to:e.target.value}))}/>
        </div>
        <div className="filters-actions">
          <button className="btn btn-primary btn-sm" onClick={applyFilters}>Применить</button>
          <button className="btn btn-ghost btn-sm" onClick={resetFilters}>Сбросить</button>
        </div>
      </div>

      <div className="export-row">
        <button className="export-btn export-csv" onClick={exportCSV}>⬇ CSV</button>
        <span className="leads-count">Всего: <b>{total}</b> · Стр. {page}/{totalPages}</span>
      </div>

      <div className="table-wrap">
        {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
        :leads.length===0?<div style={{textAlign:'center',padding:44,color:'var(--ink-4)'}}>Лиды не найдены</div>
        :<>
          <div className="table-scroll"><table>
            <thead><tr><th>#</th><th>Имя / Username</th><th>Бизнес</th><th>Телефон</th><th>Статус</th><th>Триггер</th><th>📅 Звонок / Встреча</th><th>Создан</th></tr></thead>
            <tbody>
              {leads.map(l=>(
                <tr key={l.id} className="clickable" onClick={()=>setSelected(l)}>
                  <td className="td-date">{l.id}</td>
                  <td>
                    <div className="td-name">{l.full_name||'—'}</div>
                    {l.username&&<div className="td-nick" style={{marginTop:2}}>@{l.username}</div>}
                  </td>
                  <td><span className="chip-biz">{l.business_name||'—'}</span></td>
                  <td className="td-phone">{l.phone||'—'}</td>
                  <td onClick={e=>e.stopPropagation()}>
                    <div className="status-btns">
                      {['HOT','WARM','COLD'].map(s=>(
                        <button key={s}
                          className={`sbtn sbtn-${s.toLowerCase()}${(l.status||'COLD')===s?' active':''}`}
                          onClick={()=>updateStatus(l.id,s)}>
                          {s}
                        </button>
                      ))}
                    </div>
                  </td>
                  <td>{l.trigger_word?<span className="chip-trigger">🎯 {l.trigger_word}</span>:<span style={{color:'var(--ink-4)'}}>—</span>}</td>
                  <td className="td-date" style={{whiteSpace:'nowrap',color:l.scheduled_at?'var(--c1)':'var(--ink-4)',fontWeight:l.scheduled_at?600:400}}>
                    {l.scheduled_at?fmtDT(l.scheduled_at):'—'}
                  </td>
                  <td className="td-date">{fmtDate(l.created_at)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
          <div className="pagination">
            <button className="page-btn" disabled={page<=1} onClick={()=>setPage(1)}>«</button>
            <button className="page-btn" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>‹</button>
            <span className="page-info">{page} / {totalPages}</span>
            <button className="page-btn" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>›</button>
            <button className="page-btn" disabled={page>=totalPages} onClick={()=>setPage(totalPages)}>»</button>
          </div>
        </>}
      </div>

      {selected&&<LeadHistoryModal lead={selected} auth={auth} onClose={()=>setSelected(null)} onStatusChange={handleStatusChange}/>}
    </div>
  );
}

// ── Analytics Tab ─────────────────────────────────────────────────────────────
function AnalyticsTab({auth}){
  const [businesses,setBusinesses]=React.useState([]);
  const [bizFilter,setBiz]=React.useState('');
  const [days,setDays]=React.useState(14);
  const [funnel,setFunnel]=React.useState(null);
  const [byDay,setByDay]=React.useState([]);
  const [words,setWords]=React.useState([]);
  const [loading,setLoading]=React.useState(false);

  React.useEffect(()=>{
    fetch(API_BASE+'/api/businesses',{headers:authHeaders(auth)})
      .then(r=>r.json()).then(d=>{
        const arr=Array.isArray(d.businesses)?d.businesses:Array.isArray(d)?d:[];
        setBusinesses(arr);
        if(arr.length===1) setBiz(String(arr[0].id)); // auto-select single (user's own) biz
      }).catch(()=>{});
  },[]);

  React.useEffect(()=>{load();},[bizFilter,days]);

  async function load(){
    setLoading(true);
    const p=bizFilter?`&business_id=${bizFilter}`:'';
    const h=authHeaders(auth);
    try{
      const [rf,rd,rw]=await Promise.all([
        fetch(API_BASE+`/api/analytics/funnel?${p}`,{headers:h}).then(r=>r.json()),
        fetch(API_BASE+`/api/analytics/leads-by-day?days=${days}${p}`,{headers:h}).then(r=>r.json()),
        fetch(API_BASE+`/api/analytics/trigger-words?${p}`,{headers:h}).then(r=>r.json()),
      ]);
      setFunnel(rf.stages||[]);
      setByDay(Array.isArray(rd)?rd:[]);
      setWords(Array.isArray(rw)?rw:[]);
    }catch{}
    setLoading(false);
  }

  // ── SVG Bar Chart (leads by day) ───────────────────────────────────────────
  function LeadsByDayChart(){
    if(!byDay.length) return <div style={{textAlign:'center',padding:32,color:'var(--ink-4)'}}>Нет данных за выбранный период</div>;
    const W=800,H=180,PL=36,PR=16,PT=10,PB=36;
    const cw=W-PL-PR, ch=H-PT-PB;
    const maxV=Math.max(...byDay.map(d=>d.count),1);
    const barW=Math.max(4,Math.floor(cw/byDay.length)-3);
    const yTicks=[0,Math.round(maxV/2),maxV];

    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {/* grid lines */}
        {yTicks.map(v=>{
          const y=PT+ch-(v/maxV)*ch;
          return <g key={v}>
            <line x1={PL} x2={W-PR} y1={y} y2={y} stroke="var(--line)" strokeWidth="1"/>
            <text x={PL-6} y={y+4} textAnchor="end" fontSize="10" fill="var(--ink-4)">{v}</text>
          </g>;
        })}
        {/* bars */}
        {byDay.map((d,i)=>{
          const bh=Math.max(2,(d.count/maxV)*ch);
          const x=PL+i*(cw/byDay.length)+(cw/byDay.length-barW)/2;
          const y=PT+ch-bh;
          const lbl=d.day.slice(5).replace('-','.');
          const showLbl=byDay.length<=14||(i%(Math.ceil(byDay.length/14))===0);
          return <g key={d.day}>
            <rect x={x} y={y} width={barW} height={bh} rx="3" fill="#16a34a" opacity=".85"/>
            {d.count>0&&<text x={x+barW/2} y={y-4} textAnchor="middle" fontSize="9.5" fill="var(--ink-3)">{d.count}</text>}
            {showLbl&&<text x={x+barW/2} y={H-4} textAnchor="middle" fontSize="9.5" fill="var(--ink-4)">{lbl}</text>}
          </g>;
        })}
        {/* axes */}
        <line x1={PL} x2={PL} y1={PT} y2={PT+ch} stroke="var(--line)" strokeWidth="1"/>
        <line x1={PL} x2={W-PR} y1={PT+ch} y2={PT+ch} stroke="var(--line)" strokeWidth="1"/>
      </svg>
    );
  }

  // ── Funnel ─────────────────────────────────────────────────────────────────
  function FunnelChart(){
    if(!funnel||!funnel.length) return <div style={{textAlign:'center',padding:32,color:'var(--ink-4)'}}>Нет данных</div>;
    const max=funnel[0]?.value||1;
    return(
      <div style={{display:'flex',flexDirection:'column',gap:10,padding:'4px 0'}}>
        {funnel.map((s,i)=>{
          const pct=max>0?Math.round((s.value/max)*100):0;
          const conv=i>0&&funnel[i-1].value>0?Math.round((s.value/funnel[i-1].value)*100):null;
          return(
            <div key={s.label}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:12,fontWeight:600,color:'var(--ink-2)'}}>{s.label}</span>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {conv!==null&&<span style={{fontSize:11,color:'var(--ink-4)'}}>↓ {conv}%</span>}
                  <span className="mono" style={{fontSize:13,fontWeight:700,color:'var(--ink)',minWidth:32,textAlign:'right'}}>{s.value}</span>
                </div>
              </div>
              <div style={{height:10,background:'var(--line)',borderRadius:99,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${pct}%`,background:s.color,borderRadius:99,transition:'width .4s ease'}}/>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  // ── Trigger Words ──────────────────────────────────────────────────────────
  function TriggerWordsChart(){
    if(!words.length) return <div style={{textAlign:'center',padding:32,color:'var(--ink-4)'}}>Нет данных</div>;
    const max=words[0]?.count||1;
    const colors=['#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#6366f1','#8b5cf6','#ec4899','#14b8a6','#84cc16'];
    return(
      <div style={{display:'flex',flexDirection:'column',gap:9}}>
        {words.map((w,i)=>{
          const pct=Math.round((w.count/max)*100);
          return(
            <div key={w.word} style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:11,fontWeight:600,color:'var(--ink-2)',width:110,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.word}</span>
              <div style={{flex:1,height:9,background:'var(--line)',borderRadius:99,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${pct}%`,background:colors[i%colors.length],borderRadius:99,transition:'width .4s ease'}}/>
              </div>
              <span className="mono" style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',minWidth:24,textAlign:'right'}}>{w.count}</span>
            </div>
          );
        })}
      </div>
    );
  }

  const card=(title,children,fullWidth=false)=>(
    <div className="analytics-card" style={{background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',overflow:'hidden',gridColumn:fullWidth?'1/-1':'auto'}}>
      <div style={{padding:'14px 18px',borderBottom:'1px solid var(--line)',fontWeight:650,fontSize:13.5,letterSpacing:'-.01em'}}>{title}</div>
      <div style={{padding:18}}>{loading?<div className="spinner-wrap"><div className="spinner"/></div>:children}</div>
    </div>
  );

  return(
    <div>
      <div className="filters-bar" style={{marginBottom:20}}>
        {businesses.length>1&&<div className="filter-group">
          <span className="filter-label">Бизнес</span>
          <select className="filter-select" value={bizFilter} onChange={e=>setBiz(e.target.value)}>
            <option value="">Все бизнесы</option>
            {businesses.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        </div>}
        <div className="filter-group">
          <span className="filter-label">График за</span>
          <div className="seg" style={{height:34,alignItems:'center'}}>
            {[[7,'7 дн.'],[14,'14 дн.'],[30,'30 дн.']].map(([v,l])=>(
              <button key={v} className={days===v?'on':''} onClick={()=>setDays(v)} style={{padding:'3px 12px'}}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      {card('📈 Лиды по дням',<LeadsByDayChart/>,true)}
      <div style={{display:'grid',gridTemplateColumns:'3fr 2fr',gap:16,marginTop:16}}>
        {card('📊 Воронка конверсии',<FunnelChart/>)}
        {card('🎯 Топ триггерных слов',<TriggerWordsChart/>)}
      </div>
    </div>
  );
}

// ── Bookings Tab ──────────────────────────────────────────────────────────────
function BookingsTab({auth, bizLock}){
  const [bookings,setBookings]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [bizNames,setBizNames]=React.useState([]);
  const [statusMap,setStatusMap]=React.useState({});
  const [filters,setFilters]=React.useState({business_name:bizLock||''});
  const [pending,setPending]=React.useState({business_name:bizLock||''});

  React.useEffect(()=>{
    if(bizLock) return;
    sbGet('bookings',{select:'business_name',order:'business_name.asc',limit:500})
      .then(({data})=>{setBizNames([...new Set(data.map(r=>r.business_name).filter(Boolean))]);})
      .catch(()=>{});
  },[]);
  React.useEffect(()=>{load();},[filters]);

  async function load(){
    setLoading(true);
    const p={select:'*',order:'created_at.desc',limit:200};
    if(filters.business_name) p['business_name']=`eq.${filters.business_name}`;
    const {data}=await sbGet('bookings',p);setBookings(data);
    setLoading(false);
  }

  function getStatus(id){return statusMap[id]||'pending';}
  function changeStatus(id,status){setStatusMap(m=>({...m,[id]:status}));}

  const allBookings=bookings.map(b=>({...b,_status:getStatus(b.id)}));
  const counts={total:allBookings.length,pending:allBookings.filter(b=>b._status==='pending').length,done:allBookings.filter(b=>b._status==='done').length,cancelled:allBookings.filter(b=>b._status==='cancelled').length};
  const si={pending:{l:'Ожидает',c:'badge-pending'},done:{l:'Проведён',c:'badge-done'},cancelled:{l:'Отменён',c:'badge-cancelled'}};

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:20}}>
        {[{l:'Всего',v:counts.total,col:'var(--ink)'},{l:'Ожидает',v:counts.pending,col:'#d48806'},{l:'Проведено',v:counts.done,col:'var(--c1)'},{l:'Отменено',v:counts.cancelled,col:'var(--danger)'}].map(s=>(
          <div key={s.l} className="stat-mini" style={{background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',padding:'14px 20px',boxShadow:'var(--shadow)',flex:1,textAlign:'center'}}>
            <div className="mono" style={{fontSize:26,fontWeight:700,color:s.col}}>{s.v}</div>
            <div style={{fontSize:12,color:'var(--ink-3)',marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div className="filters-bar">
        {!bizLock&&<div className="filter-group">
          <span className="filter-label">Бизнес</span>
          <select className="filter-select" value={pending.business_name} onChange={e=>setPending(p=>({...p,business_name:e.target.value}))}>
            <option value="">Все бизнесы</option>
            {bizNames.map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </div>}
        <div className="filters-actions">
          <button className="btn btn-primary btn-sm" onClick={()=>setFilters({...pending})}>Применить</button>
          {!bizLock&&<button className="btn btn-ghost btn-sm" onClick={()=>{const e={business_name:''};setPending(e);setFilters(e);}}>Сбросить</button>}
        </div>
      </div>

      <div className="table-wrap">
        {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
        :allBookings.length===0?<div style={{textAlign:'center',padding:44,color:'var(--ink-4)'}}>Записей на созвон нет</div>
        :<div className="table-scroll"><table>
          <thead><tr><th>#</th><th>Клиент</th><th>Бизнес</th><th>Телефон</th><th>Дата и время созвона</th><th>Создан</th><th>Статус</th><th>Действие</th></tr></thead>
          <tbody>
            {allBookings.map(b=>{
              const s=si[b._status]||si.pending;
              return(
                <tr key={b.id}>
                  <td className="td-date">{b.id}</td>
                  <td>
                    <div className="td-name">{b.full_name||'—'}</div>
                    {b.username&&<div className="td-nick" style={{marginTop:2}}>@{b.username}</div>}
                  </td>
                  <td><span className="chip-biz">{b.business_name||'—'}</span></td>
                  <td className="td-phone">{b.phone||'—'}</td>
                  <td className="td-time">{b.scheduled_datetime||<span style={{color:'var(--ink-4)'}}>не указано</span>}</td>
                  <td className="td-date">{fmtDate(b.created_at)}</td>
                  <td><span className={`badge ${s.c}`}>{s.l}</span></td>
                  <td>
                    {b._status==='pending'&&<div style={{display:'flex',gap:6}}>
                      <button className="btn btn-primary btn-sm" style={{fontSize:11}} onClick={()=>changeStatus(b.id,'done')}>✅ Проведён</button>
                      <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)',borderColor:'var(--danger-line)',fontSize:11}} onClick={()=>changeStatus(b.id,'cancelled')}>❌ Отменить</button>
                    </div>}
                    {b._status!=='pending'&&<button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>changeStatus(b.id,'pending')}>↩ Вернуть</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table></div>}
      </div>
    </div>
  );
}

// ── Platform Modal ────────────────────────────────────────────────────────────
function PlatformModal({auth,onClose}){
  const [view,setView]=React.useState('list'); // list | add | edit
  const [businesses,setBusinesses]=React.useState([]);
  const [status,setStatus]=React.useState(null);
  const [editBiz,setEditBiz]=React.useState(null);
  const [loading,setLoading]=React.useState(false);
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState(null);
  const emptyForm={bot_token:'',name:'',system_prompt:'',welcome_message:'',manager_link:'@akovpyat',is_active:true};
  const [form,setForm]=React.useState(emptyForm);

  const H=authHeaders(auth);

  async function load(){
    setLoading(true);
    try{
      const [rb,rs]=await Promise.all([
        fetch(API_BASE+'/api/businesses',{headers:H}).then(r=>r.json()),
        fetch(API_BASE+'/api/platform/status',{headers:H}).then(r=>r.json()).catch(()=>null),
      ]);
      setBusinesses(Array.isArray(rb.businesses)?rb.businesses:Array.isArray(rb)?rb:[]);
      setStatus(rs);
    }catch(e){console.error(e);}
    setLoading(false);
  }

  React.useEffect(()=>{load();},[]);

  function openAdd(){setForm(emptyForm);setView('add');}
  function openEdit(b){
    setEditBiz(b);
    setForm({bot_token:b.bot_token,name:b.name,system_prompt:b.system_prompt,welcome_message:b.welcome_message||'',manager_link:b.manager_link||'@akovpyat',is_active:b.is_active});
    setView('edit');
  }

  async function save(){
    if(!form.bot_token||!form.name||!form.system_prompt){setMsg({ok:false,text:'Заполните токен, название и промпт'});return;}
    setSaving(true);setMsg(null);
    try{
      const url=view==='edit'?API_BASE+`/api/businesses/${editBiz.id}`:API_BASE+'/api/businesses';
      const method=view==='edit'?'PUT':'POST';
      const r=await fetch(url,{method,headers:H,body:JSON.stringify(form)});
      const d=await r.json();
      if(!r.ok){setMsg({ok:false,text:d.error||'Ошибка'});}
      else{setMsg({ok:true,text:view==='edit'?'Обновлено':'Бизнес добавлен'});await load();setView('list');}
    }catch(e){setMsg({ok:false,text:'Сетевая ошибка'});}
    setSaving(false);
  }

  async function toggleActive(b){
    await fetch(API_BASE+`/api/businesses/${b.id}`,{method:'PUT',headers:H,body:JSON.stringify({is_active:!b.is_active})});
    load();
  }

  const onlineIds=new Set((status?.bots||[]).filter(b=>b.online).map(b=>b.id));

  // ── styles inline ──
  const card={background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)'};
  const inp={width:'100%',padding:'8px 12px',borderRadius:'var(--radius-sm)',border:'1px solid var(--line)',background:'var(--bg-page)',color:'var(--ink)',font:'inherit',fontSize:13,outline:'none',boxSizing:'border-box'};
  const lbl={fontSize:11,fontWeight:600,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'.05em',display:'block',marginBottom:4};

  function FormView(){
    return(
      <div style={{maxWidth:680,margin:'0 auto',display:'flex',flexDirection:'column',gap:16}}>
        {msg&&<div style={{padding:'10px 14px',borderRadius:'var(--radius-sm)',background:msg.ok?'#f0fdf4':'#fff5f5',color:msg.ok?'#166534':'#991b1b',border:`1px solid ${msg.ok?'#86efac':'#fca5a5'}`,fontSize:13}}>{msg.text}</div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <label style={lbl}>Токен бота *</label>
            <input style={inp} placeholder="1234567890:AAF..." value={form.bot_token} onChange={e=>setForm(f=>({...f,bot_token:e.target.value}))}/>
          </div>
          <div>
            <label style={lbl}>Название бизнеса *</label>
            <input style={inp} placeholder="Школа программирования" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          </div>
        </div>
        <div>
          <label style={lbl}>Системный промпт * <span style={{color:'var(--ink-4)',fontWeight:400}}>— роль, стиль, знания о продукте. Без приветствия и правил квалификации.</span></label>
          <textarea style={{...inp,height:180,resize:'vertical',lineHeight:1.6}} placeholder="Ты — менеджер по продажам [название]. Твоя задача — рассказывать о продукте и помогать клиенту принять решение. Отвечай коротко, по делу, без лишнего." value={form.system_prompt} onChange={e=>setForm(f=>({...f,system_prompt:e.target.value}))}/>
        </div>
        <div>
          <label style={lbl}>Первое сообщение бота <span style={{color:'var(--ink-4)',fontWeight:400}}>— отправляется автоматически когда пользователь открывает чат</span></label>
          <textarea style={{...inp,height:72,resize:'vertical'}} placeholder="Привет! Я помогу вам с [продукт]. Что вас интересует?" value={form.welcome_message} onChange={e=>setForm(f=>({...f,welcome_message:e.target.value}))}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <label style={lbl}>Менеджер (ссылка)</label>
            <input style={inp} placeholder="@username" value={form.manager_link} onChange={e=>setForm(f=>({...f,manager_link:e.target.value}))}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,paddingTop:20}}>
            <input type="checkbox" id="is_active" checked={form.is_active} onChange={e=>setForm(f=>({...f,is_active:e.target.checked}))} style={{width:16,height:16,cursor:'pointer'}}/>
            <label htmlFor="is_active" style={{...lbl,margin:0,cursor:'pointer'}}>Бот активен</label>
          </div>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={()=>{setView('list');setMsg(null);}}>Отмена</button>
          <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'Сохранение…':view==='edit'?'Сохранить изменения':'Добавить бизнес'}</button>
        </div>
      </div>
    );
  }

  function ListView(){
    const bots=status?.bots||[];
    const hasBiz=businesses.length>0;
    return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        {/* Платформа статус — только когда есть хотя бы один бизнес */}
        {status&&hasBiz&&(
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
            {[
              {l:'Всего лидов',v:status.total_leads,c:'var(--c4)'},
              {l:'HOT лидов',v:status.total_hot,c:'var(--c3)'},
              {l:'Записей',v:status.total_bookings,c:'var(--c2)'},
              {l:'Ботов онлайн',v:status.active_bots,c:'var(--c1)'},
            ].map(s=>(
              <div key={s.l} style={{...card,padding:'14px 18px',textAlign:'center'}}>
                <div className="mono" style={{fontSize:28,fontWeight:700,color:s.c}}>{s.v??'—'}</div>
                <div style={{fontSize:11,color:'var(--ink-3)',marginTop:2}}>{s.l}</div>
              </div>
            ))}
          </div>
        )}

        {/* Пустой стейт — нет бизнесов */}
        {!loading&&!hasBiz&&(
          <div style={{textAlign:'center',padding:'40px 20px'}}>
            <div style={{fontSize:48,marginBottom:16}}>🚀</div>
            <div style={{fontWeight:700,fontSize:18,color:'var(--ink)',marginBottom:8}}>Запустите своего первого AI-продавца</div>
            <div style={{fontSize:13,color:'var(--ink-3)',maxWidth:380,margin:'0 auto',lineHeight:1.6}}>
              Добавьте бизнес — и бот начнёт обрабатывать клиентов, собирать лиды и записывать на встречи без вашего участия.
            </div>
          </div>
        )}

        {/* Список бизнесов */}
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
          :businesses.map(b=>{
            const online=onlineIds.has(b.id);
            const botSt=bots.find(x=>x.id===b.id);
            return(
              <div key={b.id} style={{...card,padding:'18px 20px',display:'flex',gap:16,alignItems:'flex-start'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                    <span style={{fontWeight:700,fontSize:15}}>{b.name}</span>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:999,fontSize:11,fontWeight:700,
                      background:online?'#f0fdf4':'#fafafa',color:online?'#166534':'var(--ink-4)',
                      border:`1px solid ${online?'#86efac':'var(--line)'}`}}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:online?'#22c55e':'var(--ink-4)',display:'inline-block'}}/>
                      {online?'Онлайн':'Офлайн'}
                    </span>
                    {!b.is_active&&<span style={{padding:'2px 8px',borderRadius:999,fontSize:11,fontWeight:600,background:'#fff5f5',color:'#991b1b',border:'1px solid #fca5a5'}}>Отключён</span>}
                  </div>
                  <div style={{fontSize:12,color:'var(--ink-3)',fontFamily:'"Geist Mono",monospace',marginBottom:8}}>{b.bot_token.slice(0,20)}…</div>
                  <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                    {[
                      {l:'Лидов',v:b.stats?.total_leads??0},
                      {l:'HOT',v:b.stats?.hot_leads??0},
                      {l:'Записей',v:b.stats?.bookings??0},
                    ].map(s=>(
                      <div key={s.l} style={{textAlign:'center'}}>
                        <div style={{fontWeight:700,fontSize:16,color:'var(--ink)'}}>{s.v}</div>
                        <div style={{fontSize:10,color:'var(--ink-4)',textTransform:'uppercase',letterSpacing:'.05em'}}>{s.l}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(b)}>✏️ Редактировать</button>
                  <button className="btn btn-ghost btn-sm" style={{color:b.is_active?'var(--danger)':'var(--c1)',borderColor:b.is_active?'var(--danger-line)':'#86efac'}}
                    onClick={()=>toggleActive(b)}>{b.is_active?'⏸ Отключить':'▶ Включить'}</button>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn btn-primary" onClick={openAdd}>+ Добавить бизнес</button>
        </div>
      </div>
    );
  }

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:820,maxHeight:'92vh'}}>
        <div className="modal-hd" style={{background:'var(--bg-dg)',borderRadius:'var(--radius) var(--radius) 0 0'}}>
          <div className="modal-hd-info">
            <div className="modal-hd-name" style={{color:'#fff',fontSize:17}}>
              {view==='list'?'⚙️ Управление платформой':view==='add'?'➕ Новый бизнес':'✏️ Редактировать бизнес'}
            </div>
            <div className="modal-hd-meta" style={{color:'rgba(255,255,255,.5)'}}>
              {view==='list'?`${businesses.length} бизнесов`:'Заполните данные'}
            </div>
          </div>
          <button className="modal-close" onClick={onClose} style={{background:'rgba(255,255,255,.1)',color:'#fff',border:'1px solid rgba(255,255,255,.2)'}}>×</button>
        </div>
        <div className="modal-body" style={{padding:24}}>
          {view==='list'?ListView():FormView()}
        </div>
      </div>
    </div>
  );
}

// ── Settings Tab ─────────────────────────────────────────────────────────────
function SettingsTab({auth}){
  const H=authHeaders(auth);
  const inp={width:'100%',padding:'9px 12px',borderRadius:'var(--radius-sm)',border:'1px solid var(--line)',background:'var(--bg-page)',color:'var(--ink)',font:'inherit',fontSize:13,outline:'none',boxSizing:'border-box',transition:'border-color .15s'};
  const lbl={fontSize:11,fontWeight:600,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'.05em',display:'block',marginBottom:5};
  const sec=(icon,title,sub,children)=>(
    <div style={{background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',marginBottom:20,overflow:'hidden'}}>
      <div style={{padding:'16px 22px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:18}}>{icon}</span>
        <div><div style={{fontWeight:650,fontSize:14}}>{title}</div>{sub&&<div style={{fontSize:12,color:'var(--ink-3)',marginTop:1}}>{sub}</div>}</div>
      </div>
      <div style={{padding:'20px 22px'}}>{children}</div>
    </div>
  );

  // ── 3. Ключевые слова ──────────────────────────────────────────────────────
  const defHot='купить, цена, оплатить, договор, счет, покупка, хочу заказать, нужен срочно, записаться, хочу записаться, созвон, встретиться, позвоните, демо, покажите, запишите, запись, хочу попробовать, когда можно начать, как записаться, хочу начать, готов начать, оформить';
  const defWarm='интересно, расскажите, как работает, пример, сравнение, стоимость, есть ли скидка, возможно ли, автоматизация, хочу узнать, подробнее, а если, сколько стоит, какая цена, что входит, расскажи';
  const defCold='не надо, не интересно, потом, не сейчас, не нужно, отпишитесь, спам, отказаться';
  const [kw,setKw]=React.useState({hot:defHot,warm:defWarm,cold:defCold});
  const [kwMsg,setKwMsg]=React.useState(null);
  const [kwSaving,setKwSaving]=React.useState(false);
  const [kwLoading,setKwLoading]=React.useState(true);

  const [webhookUrl,setWebhookUrl]=React.useState('');
  const [webhookMsg,setWebhookMsg]=React.useState(null);
  const [webhookSaving,setWebhookSaving]=React.useState(false);

  React.useEffect(()=>{
    fetch(API_BASE+'/api/settings/keywords').then(r=>r.json()).then(d=>{
      if(d.hot||d.warm||d.cold) setKw({hot:d.hot||defHot,warm:d.warm||defWarm,cold:d.cold||defCold});
      setKwLoading(false);
    }).catch(()=>setKwLoading(false));
    fetch(API_BASE+'/api/settings/templates').then(r=>r.json()).then(d=>{
      if(d.templates&&d.templates.length) setTpls(d.templates);
    }).catch(()=>{});
    fetch(API_BASE+'/api/settings/webhook',{headers:H}).then(r=>r.json()).then(d=>{
      if(d.url) setWebhookUrl(d.url);
    }).catch(()=>{});
  },[]);

  async function saveKw(){
    setKwSaving(true);setKwMsg(null);
    try{
      const r=await fetch(API_BASE+'/api/settings/keywords',{method:'POST',headers:H,body:JSON.stringify(kw)});
      if(r.ok){setKwMsg({ok:true,t:'Ключевые слова сохранены'});}
      else{setKwMsg({ok:false,t:'Ошибка сохранения'});}
    }catch{setKwMsg({ok:true,t:'Сохранено локально'});}
    setKwSaving(false);
  }

  // ── 5. Рабочие часы ────────────────────────────────────────────────────────
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const [hours,setHours]=React.useState({enabled:true,from:'09:00',to:'21:00',days:[0,1,2,3,4],offMsg:'Мы сейчас не работаем. Ваш запрос получен, свяжемся в рабочее время!'});
  const [hoursMsg,setHoursMsg]=React.useState(null);
  function toggleDay(i){setHours(h=>({...h,days:h.days.includes(i)?h.days.filter(d=>d!==i):[...h.days,i].sort()}));}
  async function saveHours(){
    try{
      const r=await fetch(API_BASE+'/api/settings/working-hours',{method:'POST',headers:H,body:JSON.stringify(hours)});
      setHoursMsg({ok:r.ok,t:r.ok?'Расписание сохранено':'Ошибка'});
    }catch{setHoursMsg({ok:true,t:'Сохранено'});}
  }

  // ── 6. Шаблоны сообщений ──────────────────────────────────────────────────
  const [tpls,setTpls]=React.useState([
    {id:1,name:'Предложение созвона',text:'Давайте обсудим детали на созвоне — это займёт 15–20 минут. Когда вам удобно?'},
    {id:2,name:'Возражение: дорого',text:'Понимаю. Давайте разберём что именно входит в стоимость — думаю, увидите что это выгодно.'},
    {id:3,name:'Возражение: подумаю',text:'Конечно, не тороплю. Если появятся вопросы — я здесь. Могу отправить подробную информацию?'},
    {id:4,name:'Прощание',text:'Спасибо за обращение! Если появятся вопросы — пишите. 🚀'},
  ]);
  const [tplMsg,setTplMsg]=React.useState(null);
  function updateTpl(id,field,val){setTpls(t=>t.map(x=>x.id===id?{...x,[field]:val}:x));}
  function addTpl(){setTpls(t=>[...t,{id:Date.now(),name:'Новый шаблон',text:''}]);}
  function delTpl(id){setTpls(t=>t.filter(x=>x.id!==id));}
  async function saveTpls(){
    try{
      const r=await fetch(API_BASE+'/api/settings/templates',{method:'POST',headers:H,body:JSON.stringify({templates:tpls})});
      setTplMsg({ok:r.ok,t:r.ok?'Шаблоны сохранены':'Ошибка'});
    }catch{setTplMsg({ok:true,t:'Сохранено'});}
  }

  async function saveWebhook(){
    setWebhookSaving(true);setWebhookMsg(null);
    try{
      const r=await fetch(API_BASE+'/api/settings/webhook',{method:'POST',headers:H,body:JSON.stringify({url:webhookUrl})});
      setWebhookMsg({ok:r.ok,t:r.ok?'Webhook сохранён':'Ошибка сохранения'});
    }catch{setWebhookMsg({ok:true,t:'Сохранено локально'});}
    setWebhookSaving(false);
  }

  const Msg=({m})=>m?<div style={{padding:'8px 12px',borderRadius:6,background:m.ok?'#f0fdf4':'#fff5f5',color:m.ok?'#166534':'#991b1b',border:`1px solid ${m.ok?'#86efac':'#fca5a5'}`,fontSize:12,marginTop:12}}>{m.t}</div>:null;

  return(
    <div style={{maxWidth:800}}>
      {sec('🎯','Ключевые слова квалификации','Слова, по которым бот определяет статус лида. Через запятую.',
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {[{l:'🔥 HOT — запись на созвон',k:'hot',c:'#ef4444'},{l:'⚡ WARM — проявил интерес',k:'warm',c:'#f97316'},{l:'❄️ COLD — отказ / нет интереса',k:'cold',c:'#3b82f6'}].map(({l,k,c})=>(
            <div key={k}>
              <label style={{...lbl,color:c}}>{l}</label>
              <textarea style={{...inp,height:64,resize:'vertical',lineHeight:1.5}} value={kw[k]} onChange={e=>setKw(w=>({...w,[k]:e.target.value}))}/>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,alignItems:'center'}}>
            <Msg m={kwMsg}/>
            <button className="btn btn-primary btn-sm" onClick={saveKw} disabled={kwSaving}>{kwSaving?'…':'Сохранить'}</button>
          </div>
        </div>
      )}

      {sec('🕐','Рабочие часы','В нерабочее время бот отправляет автоответ',
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <input type="checkbox" id="hrs_en" checked={hours.enabled} onChange={e=>setHours(h=>({...h,enabled:e.target.checked}))} style={{width:16,height:16,cursor:'pointer'}}/>
            <label htmlFor="hrs_en" style={{fontSize:13,fontWeight:600,cursor:'pointer'}}>Включить ограничение рабочих часов</label>
          </div>
          <div style={{display:'flex',gap:12,alignItems:'center',opacity:hours.enabled?1:.4,transition:'opacity .2s'}}>
            <div><label style={lbl}>С</label><input style={{...inp,width:110}} type="time" value={hours.from} onChange={e=>setHours(h=>({...h,from:e.target.value}))}/></div>
            <div><label style={lbl}>До</label><input style={{...inp,width:110}} type="time" value={hours.to} onChange={e=>setHours(h=>({...h,to:e.target.value}))}/></div>
            <div>
              <label style={lbl}>Дни работы</label>
              <div style={{display:'flex',gap:4}}>
                {days.map((d,i)=>(
                  <button key={i} type="button" onClick={()=>toggleDay(i)}
                    style={{width:34,height:34,borderRadius:8,border:'1px solid',fontSize:11,fontWeight:700,cursor:'pointer',
                      background:hours.days.includes(i)?'var(--accent)':'var(--bg-page)',
                      color:hours.days.includes(i)?'#fff':'var(--ink-3)',
                      borderColor:hours.days.includes(i)?'var(--accent)':'var(--line)',transition:'all .15s'}}>{d}</button>
                ))}
              </div>
            </div>
          </div>
          <div>
            <label style={lbl}>Сообщение в нерабочее время</label>
            <textarea style={{...inp,height:56,resize:'vertical'}} value={hours.offMsg} onChange={e=>setHours(h=>({...h,offMsg:e.target.value}))}/>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end'}}><button className="btn btn-primary btn-sm" onClick={saveHours}>Сохранить расписание</button></div>
          <Msg m={hoursMsg}/>
        </div>
      )}

      {sec('💬','Шаблоны ответов','Бот использует их дословно в нужной ситуации. Не дублируй первое сообщение — оно задаётся в настройках бизнеса.',
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {tpls.map((t,i)=>(
            <div key={t.id} style={{background:'var(--bg-page)',border:'1px solid var(--line)',borderRadius:8,padding:'14px 16px'}}>
              <div style={{display:'flex',gap:10,marginBottom:8,alignItems:'center'}}>
                <input style={{...inp,fontWeight:600,flex:1}} placeholder="Название шаблона" value={t.name} onChange={e=>updateTpl(t.id,'name',e.target.value)}/>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)',borderColor:'var(--danger-line)',flexShrink:0}} onClick={()=>delTpl(t.id)}>✕</button>
              </div>
              <textarea style={{...inp,height:60,resize:'vertical',lineHeight:1.5}} placeholder="Текст сообщения…" value={t.text} onChange={e=>updateTpl(t.id,'text',e.target.value)}/>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
            <button className="btn btn-ghost btn-sm" onClick={addTpl}>+ Добавить шаблон</button>

              <Msg m={tplMsg}/>
              <button className="btn btn-primary btn-sm" onClick={saveTpls}>Сохранить шаблоны</button>
            </div>
          </div>
        </div>
      )}

      {sec('🔗','Webhook','Вызывается при смене статуса лида на HOT или изменении статуса встречи. Получает JSON с данными.',
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <label style={lbl}>URL для уведомлений</label>
            <input style={inp} type="url" placeholder="https://example.com/webhook" value={webhookUrl} onChange={e=>setWebhookUrl(e.target.value)}/>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,alignItems:'center'}}>
            <Msg m={webhookMsg}/>
            <button className="btn btn-primary btn-sm" onClick={saveWebhook} disabled={webhookSaving}>{webhookSaving?'…':'Сохранить'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Profile Dropdown ─────────────────────────────────────────────────────────
function ProfileDropdown({auth,onLogout,onEditProfile,onChangePassword}){
  const [open,setOpen]=React.useState(false);
  const [theme,setTheme]=React.useState(getTheme);
  const ref=React.useRef(null);
  React.useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const initials=(auth.full_name||auth.phone||auth.email||'?').slice(0,2).toUpperCase();
  const displayName=auth.full_name||(auth.role==='admin'?'Администратор':auth.phone||auth.email||'Профиль');
  function toggleTheme(){const t=theme==='light'?'dark':'light';setTheme(t);applyTheme(t);setOpen(false);}
  const isDark=theme==='dark';
  return(
    <div style={{position:'relative'}} ref={ref}>
      <button className="profile-btn" onClick={()=>setOpen(o=>!o)}>
        <div className="profile-avatar">{initials}</div>
        <span style={{maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{displayName}</span>
        <span style={{fontSize:9,opacity:.5,marginLeft:2,transform:open?'rotate(180deg)':'none',transition:'transform .2s',display:'inline-block'}}>▼</span>
      </button>
      {open&&(
        <div className="dropdown">
          <div style={{padding:'12px 14px 10px'}}>
            <div style={{fontWeight:700,fontSize:13,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{displayName}</div>
            {auth.company&&<div style={{fontSize:11,color:'var(--ink-3)',marginTop:1}}>{auth.company}</div>}
            <div style={{fontSize:11,color:'var(--ink-4)',marginTop:1}}>{auth.phone||auth.email||''}</div>
          </div>
          <div className="dropdown-sep"/>
          {auth.role!=='admin'&&<button className="dropdown-item" onClick={()=>{setOpen(false);onEditProfile();}}>✏️ Редактировать профиль</button>}
          <button className="dropdown-item" onClick={()=>{setOpen(false);onChangePassword();}}>🔑 Сменить пароль</button>
          <button className="dropdown-item" onClick={toggleTheme}>
            {isDark?'☀️ Светлая тема':'🌙 Тёмная тема'}
            <span style={{marginLeft:'auto',fontSize:10,padding:'2px 7px',borderRadius:4,background:isDark?'rgba(250,204,21,.12)':'rgba(99,102,241,.1)',color:isDark?'#ca8a04':'var(--c2)',fontWeight:600,border:`1px solid ${isDark?'rgba(250,204,21,.2)':'rgba(99,102,241,.2)'}`}}>{isDark?'Светло':'Темно'}</span>
          </button>
          {auth.role!=='admin'&&<>
            <div className="dropdown-sep"/>
            <button className="dropdown-item" onClick={()=>setOpen(false)}>
              💳 Оплата
              <span style={{marginLeft:'auto',fontSize:10,padding:'2px 7px',borderRadius:4,background:'rgba(22,163,74,.1)',color:'var(--accent)',fontWeight:600,border:'1px solid rgba(22,163,74,.15)'}}>Скоро</span>
            </button>
          </>}
          <div className="dropdown-sep"/>
          <button className="dropdown-item" style={{color:'rgba(220,38,38,.8)'}} onClick={()=>{setOpen(false);onLogout();}}>🚪 Выйти</button>
        </div>
      )}
    </div>
  );
}

// ── Profile Modal ─────────────────────────────────────────────────────────────
function ProfileModal({auth,onClose,onSave}){
  const [form,setForm]=React.useState({
    full_name:auth.full_name||'',
    company:auth.company||'',
    bio:auth.bio||'',
    socials:{instagram:'',telegram:'',vk:'',website:'',...(auth.socials||{})},

          </div>
          <div><label style={lbl}>О себе</label><textarea style={{...inp,height:72,resize:'vertical'}} value={form.bio} onChange={e=>setForm(f=>({...f,bio:e.target.value}))} placeholder="Кратко о вас или вашем бизнесе…"/></div>
          <div>
            <label style={{...lbl,marginBottom:8}}>Соцсети и ссылки</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {[['instagram','📸 Instagram'],['telegram','✈️ Telegram'],['vk','💬 ВКонтакте'],['website','🌐 Сайт']].map(([k,l])=>(
                <div key={k}><label style={{...lbl,fontSize:10}}>{l}</label><input style={inp} value={form.socials[k]||''} onChange={e=>setForm(f=>({...f,socials:{...f.socials,[k]:e.target.value}}))} placeholder={k==='website'?'https://...':'@username'}/></div>
              ))}
            </div>
          </div>
          {msg&&<div style={{padding:'8px 12px',borderRadius:6,background:msg.ok?'#f0fdf4':'#fff5f5',color:msg.ok?'#166534':'#991b1b',border:`1px solid ${msg.ok?'#86efac':'#fca5a5'}`,fontSize:12}}>{msg.t}</div>}
        </div>
        <div className="modal-ft"><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'Сохранение…':'Сохранить'}</button></div>
      </div>
    </div>
  );
}

// ── Change Password Modal ─────────────────────────────────────────────────────
function ChangePasswordModal({auth,isAdmin,onClose}){
  const [form,setForm]=React.useState({new_password:'',repeat:''});
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState(null);
  const inp={width:'100%',padding:'9px 12px',borderRadius:'var(--radius-sm)',border:'1px solid var(--line)',background:'var(--bg-page)',color:'var(--ink)',font:'inherit',fontSize:13,outline:'none',boxSizing:'border-box'};
  const lbl={fontSize:11,fontWeight:600,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'.05em',display:'block',marginBottom:4};

  async function save(){
    if(form.new_password!==form.repeat){setMsg({ok:false,t:'Пароли не совпадают'});return;}
    if(form.new_password.length<6){setMsg({ok:false,t:'Минимум 6 символов'});return;}
    setSaving(true);setMsg(null);
    try{
      const url=isAdmin?API_BASE+'/api/admin/password':API_BASE+'/api/auth/password';
      const headers={'Content-Type':'application/json'};
      if(isAdmin) headers['X-API-Secret']=auth.secret||'';
      else headers['Authorization']=`Bearer ${auth.token}`;
      const r=await fetch(url,{method:'PUT',headers,body:JSON.stringify({new_password:form.new_password})});
      if(r.ok){setMsg({ok:true,t:'Пароль изменён'});setForm({new_password:'',repeat:''});}
      else{const d=await r.json();setMsg({ok:false,t:d.error||'Ошибка'});}
    }catch{setMsg({ok:false,t:'Ошибка сети'});}
    setSaving(false);
  }

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="modal-hd">
          <div className="modal-hd-info"><div className="modal-hd-name">Смена пароля</div><div className="modal-hd-meta">{isAdmin?'Пароль администратора':'Ваш пароль входа'}</div></div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label style={lbl}>Новый пароль</label><input style={inp} type="password" value={form.new_password} onChange={e=>setForm(f=>({...f,new_password:e.target.value}))} autoFocus placeholder="••••••••"/></div>
          <div><label style={lbl}>Повторите пароль</label><input style={inp} type="password" value={form.repeat} onChange={e=>setForm(f=>({...f,repeat:e.target.value}))} placeholder="••••••••"/></div>
          {msg&&<div style={{padding:'8px 12px',borderRadius:6,background:msg.ok?'#f0fdf4':'#fff5f5',color:msg.ok?'#166534':'#991b1b',border:`1px solid ${msg.ok?'#86efac':'#fca5a5'}`,fontSize:12}}>{msg.t}</div>}
        </div>
        <div className="modal-ft"><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'…':'Изменить пароль'}</button></div>
      </div>
    </div>
  );
}

// ── Onboarding Modal ──────────────────────────────────────────────────────────

            <div><label style={lbl}>Как вас зовут?</label><input style={inp} value={form.full_name} onChange={e=>setForm(f=>({...f,full_name:e.target.value}))} placeholder="Иван Иванов" autoFocus/></div>
            <div><label style={lbl}>О себе <span style={{color:'var(--ink-4)',fontWeight:400,textTransform:'none',letterSpacing:0}}>(необязательно)</span></label><textarea style={{...inp,height:76,resize:'vertical'}} value={form.bio} onChange={e=>setForm(f=>({...f,bio:e.target.value}))} placeholder="Кратко о вас…"/></div>
          </>):(<>
            <div><label style={lbl}>Название компании</label><input style={inp} value={form.company} onChange={e=>setForm(f=>({...f,company:e.target.value}))} placeholder="ООО Пример" autoFocus/></div>
            <div>
              <label style={{...lbl,marginBottom:8}}>Соцсети <span style={{color:'var(--ink-4)',fontWeight:400,textTransform:'none',letterSpacing:0}}>(необязательно)</span></label>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {[['instagram','📸 Instagram'],['telegram','✈️ Telegram'],['vk','💬 ВКонтакте'],['website','🌐 Сайт']].map(([k,l])=>(
                  <div key={k} style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:'var(--ink-3)',width:100,flexShrink:0}}>{l}</span>
                    <input style={inp} value={form.socials[k]||''} onChange={e=>setForm(f=>({...f,socials:{...f.socials,[k]:e.target.value}}))} placeholder={k==='website'?'https://...':'@username'}/>
                  </div>
                ))}
              </div>
            </div>
          </>)}
        </div>
        <div className="modal-ft" style={{justifyContent:'space-between'}}>
          {step===2?<button className="btn btn-ghost" onClick={()=>setStep(1)}>← Назад</button>:<div/>}
          {step===1
            ?<button className="btn btn-primary" onClick={()=>setStep(2)}>Далее →</button>
            :<button className="btn btn-primary" onClick={finish} disabled={saving}>{saving?'…':'Готово ✓'}</button>
          }
        </div>
      </div>
    </div>
  );
}

// ── Users Management Tab (admin) ──────────────────────────────────────────────
function UsersManagementTab({auth}){
  const [users,setUsers]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [search,setSearch]=React.useState('');
  const [selected,setSelected]=React.useState(null);

  async function load(q=''){
    setLoading(true);
    try{
      const r=await fetch(API_BASE+`/api/admin/users?search=${encodeURIComponent(q)}`,{headers:{'X-API-Secret':auth.secret||''}});
      const d=await r.json();
      setUsers(d.users||[]);
    }catch{}
    setLoading(false);
  }

  React.useEffect(()=>{load();},[]);

  const searchTimer=React.useRef(null);
  function handleSearch(e){
    const v=e.target.value;
    setSearch(v);
    clearTimeout(searchTimer.current);
    searchTimer.current=setTimeout(()=>load(v),300);
  }

  if(selected){
    return(
      <div>
        <button className="btn btn-ghost btn-sm" style={{marginBottom:20}} onClick={()=>setSelected(null)}>← Все пользователи</button>
        <div style={{display:'grid',gridTemplateColumns:'280px 1fr',gap:24,alignItems:'start'}}>
          {/* User info card */}
          <div style={{background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',padding:'22px',boxShadow:'var(--shadow)',display:'flex',flexDirection:'column',gap:14,position:'sticky',top:120}}>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#1db954,#0d7a38)',display:'grid',placeItems:'center',fontSize:20,fontWeight:700,color:'#fff',flexShrink:0,boxShadow:'0 3px 10px rgba(29,185,84,.3)'}}>
                {(selected.full_name||selected.phone||'?').slice(0,2).toUpperCase()}
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:16,lineHeight:1.2}}>{selected.full_name||'—'}</div>
                <div style={{fontSize:12,color:'var(--ink-3)',marginTop:3}}>{selected.company||''}</div>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:12,color:'var(--ink-3)'}}>
              <div>📞 {selected.phone||'—'}</div>
              {selected.email&&<div>✉️ {selected.email}</div>}
              {selected.bio&&<div style={{color:'var(--ink-2)',marginTop:6,lineHeight:1.6,fontSize:12}}>{selected.bio}</div>}
            </div>
            {selected.socials&&Object.entries(selected.socials).filter(([,v])=>v).length>0&&(
              <div style={{display:'flex',flexDirection:'column',gap:5,borderTop:'1px solid var(--line)',paddingTop:12}}>
                {Object.entries(selected.socials).filter(([,v])=>v).map(([k,v])=>(
                  <div key={k} style={{fontSize:11,color:'var(--ink-3)'}}>{k}: <span style={{color:'var(--accent)',fontWeight:500}}>{v}</span></div>
                ))}
              </div>
            )}
            <div style={{borderTop:'1px solid var(--line)',paddingTop:12,display:'flex',flexDirection:'column',gap:6}}>
              <div style={{fontSize:11,color:'var(--ink-4)'}}>Зарегистрирован: {fmtDate(selected.created_at)}</div>
              <span style={{display:'inline-flex',padding:'3px 10px',borderRadius:999,fontSize:11,fontWeight:600,alignSelf:'flex-start',
                background:selected.is_active?'#f0fdf4':'#fff5f5',
                color:selected.is_active?'#166534':'#991b1b',
                border:`1px solid ${selected.is_active?'#86efac':'#fca5a5'}`}}>
                {selected.is_active?'✓ Активен':'✗ Заблокирован'}
              </span>
            </div>
          </div>

          {/* Business stats */}
          <div>
            {selected.business_name?(
              <div>
                <div style={{fontSize:14,fontWeight:650,marginBottom:16,display:'flex',alignItems:'center',gap:8}}>
                  <span>📊</span> Статистика бизнеса: <span style={{color:'var(--accent)'}}>{selected.business_name}</span>
                </div>
                <OverviewTab auth={auth} period="all" bizFilter={selected.business_name} allBusinesses={[]}/>
              </div>
            ):(
              <div style={{background:'var(--bg-card)',border:'1px solid var(--line)',borderRadius:'var(--radius)',padding:'56px',textAlign:'center',color:'var(--ink-4)',boxShadow:'var(--shadow)'}}>
                <div style={{fontSize:36,marginBottom:14}}>🏢</div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--ink-3)'}}>Бизнес не привязан</div>
                <div style={{fontSize:12,marginTop:8,lineHeight:1.6}}>Привяжите бизнес к пользователю через<br/>настройки платформы</div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:20,alignItems:'center'}}>
        <input
          style={{flex:1,height:40,padding:'0 16px',borderRadius:'var(--radius-sm)',border:'1px solid var(--line)',background:'var(--bg-card)',color:'var(--ink)',font:'inherit',fontSize:13,outline:'none',transition:'border-color .15s,box-shadow .15s'}}
          placeholder="🔍 Поиск по имени или телефону…"
          value={search} onChange={handleSearch}
        />
        <button className="btn btn-ghost btn-sm" onClick={()=>load(search)}><IcoRefresh/> Обновить</button>
        <span style={{fontSize:12,color:'var(--ink-3)',whiteSpace:'nowrap',background:'var(--bg-card)',border:'1px solid var(--line)',padding:'4px 10px',borderRadius:6}}>{users.length} пользователей</span>
      </div>

      {loading?<div className="spinner-wrap"><div className="spinner"/><span>Загрузка…</span></div>
      :users.length===0?<div style={{textAlign:'center',padding:56,color:'var(--ink-4)',fontSize:13}}>Пользователи не найдены</div>
      :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
        {users.map(u=>(
          <div key={u.id} className="user-card" onClick={()=>setSelected(u)}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
              <div style={{width:42,height:42,borderRadius:'50%',background:'linear-gradient(135deg,#1db954,#0d7a38)',display:'grid',placeItems:'center',fontSize:15,fontWeight:700,color:'#fff',flexShrink:0,boxShadow:'0 2px 8px rgba(29,185,84,.25)'}}>
                {(u.full_name||u.phone||'?').slice(0,2).toUpperCase()}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.full_name||'—'}</div>
                <div style={{fontSize:11,color:'var(--ink-3)',marginTop:1}}>{u.phone||u.email||''}</div>
              </div>
              <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:999,flexShrink:0,
                background:u.is_active?'#f0fdf4':'#fff5f5',
                color:u.is_active?'#166534':'#991b1b',
                border:`1px solid ${u.is_active?'#86efac':'#fca5a5'}`}}>
                {u.is_active?'Активен':'Откл'}
              </span>
            </div>
            {u.company&&<div style={{fontSize:12,color:'var(--ink-3)',marginBottom:6}}>🏢 {u.company}</div>}
            {u.bio&&<div style={{fontSize:11,color:'var(--ink-4)',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.bio}</div>}
            {u.business_name
              ?<div style={{fontSize:11,display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:6,background:'#f0faf4',color:'var(--ink-2)',border:'1px solid var(--line)',marginTop:4}}>📡 {u.business_name}</div>
              :<div style={{fontSize:11,color:'var(--ink-4)',marginTop:4}}>Бизнес не привязан</div>
            }
            <div style={{fontSize:10,color:'var(--ink-4)',marginTop:10,borderTop:'1px solid var(--line)',paddingTop:8}}>С {fmtDate(u.created_at)}</div>
          </div>
        ))}
      </div>}
    </div>
  );
}

// ── Admin Platform ────────────────────────────────────────────────────────────
function AdminPlatform({auth,onLogout}){
  const [tab,setTab]=React.useState('overview');
  const [period,setPeriod]=React.useState('week');
  const [bizFilter,setBiz]=React.useState('all');
  const [businesses,setBusinesses]=React.useState([]);
  const [lastRefresh,setLastRefresh]=React.useState(null);
  const [showPlatform,setShowPlatform]=React.useState(false);
  const [showChangePw,setShowChangePw]=React.useState(false);

  function reloadBusinesses(){
    fetch(API_BASE+'/api/businesses',{headers:{'X-API-Secret':auth.secret||''}})
      .then(r=>r.json()).then(d=>setBusinesses(Array.isArray(d.businesses)?d.businesses:Array.isArray(d)?d:[])).catch(()=>{});
  }
  React.useEffect(()=>{
    reloadBusinesses();
    setLastRefresh(new Date());
  },[]);

  const noControls=tab==='settings'||tab==='management';

  const tabs=[
    {key:'overview',    label:'Обзор'},
    {key:'leads',       label:'Лиды'},
    {key:'analytics',   label:'Аналитика'},
    {key:'telephony',   label:'Телефония'},
    {key:'management',  label:'Управление'},
    {key:'settings',    label:'Настройки'},
  ];

  return(
    <div className="shell">
      <header className="header">
        <div className="header-inner">
          <div className="logo-wrap">
            <div className="logo-mark">C</div>
            <div>
              <div className="logo-text">Calvix <span>AI</span></div>
              <div className="logo-sub">Sales Bot Platform</div>
            </div>
          </div>
          <div className="header-right">
            <div className="live-badge">
              <span className="live-dot"/>
              {lastRefresh?lastRefresh.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'—'}
            </div>
            <button className="hdr-btn" onClick={()=>setLastRefresh(new Date())}><IcoRefresh/> Обновить</button>
            <button className="hdr-btn" onClick={()=>setShowPlatform(true)}>⚙️ Платформа</button>
            <ProfileDropdown auth={auth} onLogout={onLogout} onEditProfile={()=>{}} onChangePassword={()=>setShowChangePw(true)}/>
          </div>
        </div>
      </header>

      {!noControls&&(
        <div className="controls">
          <div className="controls-inner">
            <span className="ctrl-label">Бизнес:</span>
            <select className="sel" value={bizFilter} onChange={e=>setBiz(e.target.value)}>
              <option value="all">Все бизнесы</option>
              {businesses.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
            <span className="ctrl-label" style={{marginLeft:8}}>Период:</span>
            <div className="seg">
              {[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время']].map(([v,l])=>(
                <button key={v} className={period===v?'on':''} onClick={()=>setPeriod(v)}>{l}</button>
              ))}
            </div>
            <div className="ctrl-spacer"/>
          </div>
        </div>
      )}

      <nav className="nav-bar">
        <div className="nav-bar-inner">
          {tabs.map(t=>(
            <button key={t.key} className={`nav-tab${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>{t.label}</button>
          ))}
        </div>
      </nav>

      {showPlatform&&<PlatformModal auth={auth} onClose={()=>{setShowPlatform(false);reloadBusinesses();}}/>}
      {showChangePw&&<ChangePasswordModal auth={auth} isAdmin={true} onClose={()=>setShowChangePw(false)}/>}

      <div className="page">
        {tab==='overview'   &&<OverviewTab         auth={auth} period={period} bizFilter={bizFilter==='all'?'':bizFilter} allBusinesses={businesses}/>}
        {tab==='leads'      &&<LeadsTab            auth={auth}/>}
        {tab==='analytics'  &&<AnalyticsTab        auth={auth}/>}
        {tab==='management' &&<UsersManagementTab  auth={auth}/>}
        {tab==='telephony'&&(
          <div className="coming-card">
            <div className="coming-icon">📞</div>
            <div className="coming-title">Телефония</div>
            <div className="coming-sub">Интеграция с IP-телефонией, запись звонков и автодозвон появятся в следующей версии.</div>
            <span className="coming-badge">Скоро</span>
          </div>
        )}
        {tab==='settings'&&<SettingsTab auth={auth}/>}
      </div>
    </div>
  );
}

// ── User Cabinet ──────────────────────────────────────────────────────────────
function UserCabinet({auth:initialAuth,onLogout}){
  const [authData,setAuthData]=React.useState(initialAuth);
  const [tab,setTab]=React.useState('overview');
  const [period,setPeriod]=React.useState('week');
  const [bizFilter,setBiz]=React.useState('all');
  const [businesses,setBusinesses]=React.useState([]);
  const [showPlatform,setShowPlatform]=React.useState(false);
  const [showProfile,setShowProfile]=React.useState(false);
  const [showChangePw,setShowChangePw]=React.useState(false);
  const [showOnboarding,setShowOnboarding]=React.useState(!initialAuth.full_name);

  function reloadBusinesses(){
    fetch(API_BASE+'/api/businesses',{headers:authHeaders(authData)})
      .then(r=>r.json()).then(d=>{
        const arr=Array.isArray(d.businesses)?d.businesses:Array.isArray(d)?d:[];
        setBusinesses(arr);
        if(arr.length===1&&!authData.business_name){
          const updated={...authData,business_name:arr[0].name,business_id:arr[0].id};
          setAuthData(updated);saveAuth(updated);
        }
      }).catch(()=>{});
  }
  React.useEffect(()=>{reloadBusinesses();},[]);

  const bizName=bizFilter==='all'?authData.business_name||'':bizFilter;

  const noControls=tab==='settings';
  const tabs=[
    {key:'overview',   label:'Обзор'},
    {key:'leads',      label:'Лиды'},
    {key:'analytics',  label:'Аналитика'},
    {key:'telephony',  label:'Телефония'},
    {key:'settings',   label:'Настройки'},
  ];

  function handleSave(updated){setAuthData(updated);saveAuth(updated);}

  return(
    <div className="shell">
      <header className="header">
        <div className="header-inner">
          <div className="logo-wrap">
            <div className="logo-mark">C</div>
            <div>
              <div className="logo-text">Calvix <span>AI</span></div>
              <div className="logo-sub">{authData.business_name||'Личный кабинет'}</div>
            </div>
          </div>
          <div className="header-right">
            <button className="hdr-btn" onClick={()=>setShowPlatform(true)}>⚙️ Платформа</button>
            <ProfileDropdown auth={authData} onLogout={onLogout} onEditProfile={()=>setShowProfile(true)} onChangePassword={()=>setShowChangePw(true)}/>
          </div>
        </div>
      </header>

      {!noControls&&(
        <div className="controls">
          <div className="controls-inner">
            {businesses.length>1&&<>
              <span className="ctrl-label">Бизнес:</span>
              <select className="sel" value={bizFilter} onChange={e=>setBiz(e.target.value)}>
                <option value="all">Все бизнесы</option>
                {businesses.map(b=><option key={b.id} value={b.name}>{b.name}</option>)}
              </select>
            </>}
            <span className="ctrl-label" style={{marginLeft:businesses.length>1?8:0}}>Период:</span>
            <div className="seg">
              {[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время']].map(([v,l])=>(
                <button key={v} className={period===v?'on':''} onClick={()=>setPeriod(v)}>{l}</button>
              ))}
            </div>
            <div className="ctrl-spacer"/>
            {authData.business_name&&<span style={{fontSize:11,color:'rgba(255,255,255,.35)',borderLeft:'1px solid rgba(255,255,255,.12)',paddingLeft:12}}>📡 {authData.business_name}</span>}
          </div>
        </div>
      )}

      <nav className="nav-bar">
        <div className="nav-bar-inner">
          {tabs.map(t=>(
            <button key={t.key} className={`nav-tab${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>{t.label}</button>
          ))}
        </div>
      </nav>

      {showPlatform&&<PlatformModal auth={authData} onClose={()=>{setShowPlatform(false);reloadBusinesses();}}/>}

      <div className="page">
        {(()=>{
          const hasBiz=!!(authData.business_name);
          const NoBizCard=()=>(
            <div className="coming-card">
              <div className="coming-icon">🤖</div>
              <div className="coming-title">Создайте своего бота</div>
              <div className="coming-sub">Нажмите ⚙️ Платформа в шапке, чтобы добавить бизнес и запустить AI-продавца.</div>
              <button className="btn btn-primary" style={{marginTop:20}} onClick={()=>setShowPlatform(true)}>⚙️ Открыть Платформу</button>
            </div>
          );
          if(tab==='overview')   return hasBiz?<OverviewTab  auth={authData} period={period} bizFilter={bizName} allBusinesses={businesses}/>:<NoBizCard/>;
          if(tab==='leads')      return hasBiz?<LeadsTab     auth={authData} bizLock={authData.business_name}/>:<NoBizCard/>;
          if(tab==='analytics')  return hasBiz?<AnalyticsTab auth={authData}/>:<NoBizCard/>;
          return null;
        })()}
        {tab==='telephony' &&(
          <div className="coming-card">
            <div className="coming-icon">📞</div>
            <div className="coming-title">Телефония</div>
            <div className="coming-sub">Интеграция с IP-телефонией, запись звонков и автодозвон появятся в следующей версии.</div>
            <span className="coming-badge">Скоро</span>
          </div>
        )}
        {tab==='settings'  &&<SettingsTab  auth={authData}/>}
      </div>

      {showOnboarding&&<OnboardingModal auth={authData} onClose={()=>setShowOnboarding(false)} onSave={handleSave}/>}
      {showProfile&&<ProfileModal auth={authData} onClose={()=>setShowProfile(false)} onSave={handleSave}/>}
      {showChangePw&&<ChangePasswordModal auth={authData} isAdmin={false} onClose={()=>setShowChangePw(false)}/>}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [auth,setAuth]=React.useState(loadAuth);
  function handleLogin(a){saveAuth(a);setAuth(a);}
  function handleLogout(){clearAuth();setAuth(null);}
  if(!auth) return <AuthScreen onLogin={handleLogin}/>;
  if(auth.role==='admin') return <AdminPlatform auth={auth} onLogout={handleLogout}/>;
  return <UserCabinet auth={auth} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
